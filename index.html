<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<title>Tally</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  header h1{font-size:20px;margin:0;letter-spacing:.3px;}
  header h1 .dot{color:var(--accent)}
  header h1 .ver{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
  /* The year: first operation to last, stepped from the top bar. */
  .ystep{display:flex;align-items:center;gap:2px}
  .ystep button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:26px;height:26px;
    font-size:15px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
  .ystep button:disabled{opacity:.3;cursor:default}
  .ystep b{font-size:14px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  /* The preferred currency: one toggle, two halves. */
  .curtog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .curtog button{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:3px 10px;cursor:pointer;font-family:inherit}
  .curtog button.on{background:var(--accent);color:#fff}
  header .hdrright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
  .hdrbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:26px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .hdrbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hdrbtn:active{color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 9px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px;}
  .muted{color:var(--muted)}

  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  /* The sub-tab bar stays put under the header while the page scrolls. */
  .pillrow.sticky{position:sticky;top:45px;z-index:15;background:var(--bg);padding:2px 0 10px;margin:-2px 0 6px}

  /* A widget over the bottom half of the screen. */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-width:560px;margin:0 auto}
  /* Slides up once, when it opens; a redraw from a chip inside must not replay it. */
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .foot{display:flex;gap:8px;padding-top:4px}
  .sheet .foot .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .sheet .foot .btn.close.arm{background:var(--bad);border-color:var(--bad);color:#fff}
  .tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:3px 8px;cursor:text;min-height:30px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:90px;width:auto;background:none;border:0;padding:2px 2px}
  .cap .x{margin-left:6px;opacity:.65;cursor:pointer;font-weight:700}
  .cap.fixed{border-color:var(--accent);color:var(--accent2)}
  .hero{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
  /* Six figures for the year, three a row. */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kpi{background:var(--card2);border-radius:12px;padding:8px 9px;min-width:0;position:relative}
  .qbtn{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--muted);
    font-size:10px;font-weight:700;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
  .kpi .l{padding-right:18px}
  .kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .kpi .v{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .m{font-size:10.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* A single bar split by share, the percentage written in each part. */
  .pbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:10px;background:var(--bg2)}
  .pbar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06101c;min-width:0;overflow:hidden}
  .herosub{font-size:12px;color:var(--muted);margin-top:3px}
  .neg{color:var(--bad)!important} .pos{color:var(--good)}
  .row .v.neg,.row .v.pos{font-weight:700}
  /* The operations filter, Bench's pattern: one round button, a panel that
     drops under it, chips for what is active. */
  .fbar{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
  .fdrop{position:relative}
  .fbtn{width:34px;height:28px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0}
  .fbtn.act{border-color:var(--accent);color:var(--accent2)}
  .fscrim{position:fixed;inset:0;z-index:8}
  .fmenu{position:absolute;right:0;top:100%;z-index:9;margin-top:6px;width:min(320px,88vw);display:flex;flex-direction:column;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
    text-align:left;font-weight:400}
  .fsearch{position:relative;margin-bottom:6px}
  .fsearch input{padding-right:30px}
  .fsearch .fx{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px}
  .ovf-addf,.ovf-exclf{display:block;width:100%;text-align:left;background:none;border:none;font-size:13px;font-weight:600;padding:7px 9px;
    border-radius:7px;cursor:pointer;font-family:inherit}
  .ovf-addf{color:#4a9eff} .ovf-exclf{color:#ff5c6c}
  .fpick{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:2px 0 6px}
  .fpick button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12.5px;padding:6px 9px;cursor:pointer;font-family:inherit}
  .fpick button.cat{font-weight:700}
  .fpick button.tag{padding-left:22px;color:var(--muted)}
  .ovf-seg{padding:6px 2px 8px;border-top:1px solid var(--line)}
  .ovf-sort{display:flex;align-items:center;gap:6px;padding:8px 2px 2px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .ovf-sort select{flex:1;min-width:0}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip.exc{background:#ff5c6c}
  .fchip.plain{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .fchip b{cursor:pointer;opacity:.75;font-weight:700}
  /* A page's Close, always at the bottom above the nav; the selection bar
     rises above it when both are there. */
  .closebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:14;margin:0 auto;max-width:528px;padding:0 12px}
  .closebar .btn{width:100%;background:rgba(24,27,36,.97);border-color:var(--line);box-shadow:0 6px 22px rgba(0,0,0,.45)}
  .selbar.raised{bottom:calc(116px + env(safe-area-inset-bottom))}
  .chart .bar{cursor:pointer}
  .chart .tick.sel{fill:#fff;font-weight:700}
  .chart .vlab{fill:var(--muted);font-size:9px}
  /* Select box on an operation row, and the bar that appears once some are. */
  .ck{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:inline-flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;cursor:pointer;margin-right:8px}
  .ck.on{background:var(--accent);border-color:var(--accent)}
  .selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;margin:0 auto;max-width:528px;
    display:flex;align-items:center;gap:7px;padding:9px 12px;background:rgba(24,27,36,.97);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.45);font-size:12.5px}
  .selbar span{flex:1;font-weight:600}
  .selbar.pick{flex-direction:column;align-items:stretch;gap:4px;padding:8px}
  .selbar .selpick{max-height:40vh;overflow:auto;display:flex;flex-direction:column}
  .selbar .selpick button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--txt);
    font-size:13px;padding:7px 9px;border-radius:7px;cursor:pointer;font-family:inherit}
  .selbar .selpick button.tag{padding-left:24px;color:var(--muted)}
  .selbar .selhead{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .bcap{font-size:10px;padding:1px 7px;margin-left:6px;vertical-align:1px;border-color:currentColor;color:currentColor}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .swatch.on{border-color:#fff}
  .bbar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:5px}
  .bbar i{display:block;height:100%;border-radius:4px}
  table.fx{border-collapse:collapse;width:100%;font-size:12.5px}
  table.fx th,table.fx td{padding:5px 4px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.fx th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  table.fx th:first-child,table.fx td:first-child{text-align:left}
  table.fx tr:last-child td{border-bottom:0}
  table.fx tr.muted td{color:var(--muted)}
  /* A line chart with a zoom: two thumbs on one track, only the thumbs take
     the finger, so the two inputs can sit on top of each other. */
  svg.chart{width:100%;height:auto;display:block}
  .chart .gl{stroke:var(--line);stroke-width:1}
  .chart .yl{fill:var(--muted);font-size:9.5px}
  .chart .tick{fill:var(--muted);font-size:9.5px}
  .chart .endlab{font-size:11px;font-weight:700;fill:#fff;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
  /* The track is drawn once, by the container; both inputs' own tracks are
     transparent, so neither thumb can sit behind the other input's line. */
  .dslider{position:relative;height:28px;margin-top:4px}
  .dslider::before{content:'';position:absolute;left:0;right:0;top:12px;height:4px;background:var(--line);border-radius:2px}
  .dslider input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none;outline:none;border:0;padding:0}
  .dslider input::-webkit-slider-runnable-track{height:4px;background:transparent}
  .dslider input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:2px solid #fff;margin-top:-9px;pointer-events:auto;cursor:pointer}
  .dslider input::-moz-range-track{height:4px;background:transparent}
  .dslider input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;pointer-events:auto}
  .drange{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;
    color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .field{margin-bottom:5px}
  .field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  input,select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:5px 10px;font-size:14px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-size:12.5px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}
  .row.tap{cursor:pointer}
  .row .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .row .chev{color:var(--muted);font-weight:700}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}
  .gbtn.ghost{background:none;color:var(--accent2);border-color:var(--line);font-weight:600;font-size:11.5px}
  .btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
  .btn.danger.arm{background:var(--bad);color:#fff}
  .act{color:var(--accent2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px 10px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .cap{font-size:11px;font-weight:600;border-radius:12px;padding:2px 8px;border:1px solid var(--line);color:var(--txt);background:var(--card2)}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,26,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10;}
  nav button{background:none;border:none;color:var(--muted);font-size:9.5px;display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;font-family:inherit}
  nav button svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  nav button.active{color:var(--accent)}

  /* The Settings sub-tabs: a bar like the bottom one, smaller, under the header. */
  .subnav{position:sticky;top:45px;z-index:15;display:flex;justify-content:space-around;background:var(--bg);
    border-bottom:1px solid var(--line);margin:-14px -16px 14px;padding:5px 0 6px}
  .subnav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;padding:2px 1px;flex:1;min-width:0;font-family:inherit}
  .subnav button svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .subnav button.active{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Tally<span class="dot">.</span> <span id="hdrRight" class="ver"></span></h1>
    <div class="ystep" id="yearStep"></div>
    <div class="hdrright"><span class="curtog" id="curTog"></span></div></header>
  <div id="tabs"></div>
</div>
<nav id="nav"></nav>

<script src="backend.js?v=39"></script>
<script>
const APP_VERSION="39";
const BK = window.TallyBackend;

/* ------------------------------------------------------------------ store --
   Everything this device remembers, in one localStorage key. */
const KEY = 'tally-v1';
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ backend:{ url:'', token:'' }, backendVersion:null, categories:[], people:[], accounts:[], ops:{}, budgets:[], rates:[], live:null, cur:'USD',
  fxFrom:2013, fxTo:new Date().getFullYear() }, loadStore());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } };

const state = { tab:'settings', settings:'data', sync:null, page:null, account:null, year:null, sub:{}, opf:null, budget:null, opAccount:null, sel:[], bulk:null, cat:null, catMonths:[] };
/* The operations filter, per visit of an account page. */
const blankFilter = () => ({ q:'', min:'', max:'', dir:'', inc:[], exc:[], sort:'date', desc:true, open:false, picking:null });
const opFilter = () => state.opf || (state.opf = blankFilter());
const filterActive = (f) => !!(f.q || f.min || f.max || f.dir || f.inc.length || f.exc.length);

/* ------------------------------------------------------------- the model --
   Categories: a unique name, a type, and tags that are unique across ALL
   categories - one tag, one category. People: a unique name and a kind. */
const TYPES = [
  ['Necessity','#f87171'], ['Optional','#fbbf24'], ['Income','#4ade80'],
  ['Taxes','#eef1f7'], ['Savings','#3b82f6'], ['Misc','#5b6170'],
];
const typeColor = (t) => (TYPES.find(([k])=>k===t) || ['','#5b6170'])[1];
const PEOPLE_TYPES = ['Parent','Child'];
const CURRENCIES = ['USD','EUR','AUD'];
/* Accounts: a unique key, a currency, owners from People, a category (is the
   money reachable) and a type (how it is recorded). Cash first; other types
   will bring their own settings later. */
const ACCOUNT_CATEGORIES = [['Cash','#3b82f6'], ['Savings','#4ade80'], ['Property','#fbbf24'], ['Excluded','#5b6170']];
const catColor = (c) => (ACCOUNT_CATEGORIES.find(([k])=>k===c) || ['','#5b6170'])[1];
const ACCOUNT_TYPES = ['Cash','Fund'];
const same = (a,b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const splitTags = (s) => { const out=[]; for (const x of String(s||'').split(',').map((v)=>v.trim()).filter(Boolean)) if (!out.some((y)=>same(y,x))) out.push(x); return out; };

/* A category's own name is always its first tag: the tags stored are the
   name, then the others - never the name twice. */
const withName = (name, tags) => [name].concat(tags.filter((t)=>!same(t,name)));
const withoutName = (name, tags) => tags.filter((t)=>!same(t,name));

/* Throws with the reason. `skip` is the category being edited. */
function checkCategory(name, type, tags, skip){
  if (!name) throw new Error('A name.');
  if (!TYPES.some(([k])=>k===type)) throw new Error('A type.');

  if (!names.length) { state.sync={ msg:'Nothing to send.' }; render(); return; }

    <div class="pbar">${pos.map(([c,v])=>{ const pc = v/sum*100; return `<span style="width:${pc.toFixed(2)}%;background:${CUR_COLORS[c]}">${pc>=8?Math.round(pc)+'%':''}</span>`; }).join('')}</div>
    <div class="legend" style="margin-top:6px;flex-wrap:wrap;gap:6px 14px">${CURRENCIES.map((c)=>`<span><i style="background:${CUR_COLORS[c]};width:9px;height:9px;border-radius:50%"></i>${c} (${money(nw.native[c], c)})</span>`).join('')}</div>`
    : `<div class="hint" style="margin-top:0">Nothing yet.</div>`}

}

/* ----------------------------------------------------------------- report --
   The year's operations summed per category, in the shown currency at each
   operation's month. A secondary tag takes its own part; the main tag keeps
   the rest. Tags no category claims are shown as Unfiled, not dropped. */
const catOfTag = (t) => store.categories.find((c)=>c.tags.some((x)=>same(x, t))) || null;
function sumsByCategory(year){
  const out = {}; let unfiled = 0;
  for (const a of store.accounts) for (const o of opsOf(a.key)) {
    if (o.date.slice(0,4)!==String(year)) continue;
    const m = o.date.slice(0,7);
    const parts = o.splits.map((sp)=>({ tag:sp.tag, amount:sp.amount }));
    parts.push({ tag:o.tag, amount: o.amount - o.splits.reduce((t,sp)=>t+sp.amount, 0) });
    for (const p of parts) {
      const v = conv(p.amount, a.currency, store.cur, m); if (v==null) continue;
      const c = catOfTag(p.tag);
      if (c) out[c.name] = (out[c.name]||0) + v; else unfiled += v;
    }
  }
  return { out, unfiled };
}
function reportGroup(title, types, sums){
  const rows = store.categories.filter((c)=>types.includes(c.type) && sums.out[c.name]).map((c)=>({ c, v:sums.out[c.name] }))
    .sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const total = rows.reduce((t,r)=>t+r.v, 0);
  return `
  <div class="card">
    <h2>${title} <span class="v ${total<0?'neg':'pos'}" style="text-transform:none;letter-spacing:0">${money(total, store.cur)}</span></h2>
    ${rows.length ? `<div class="rows">${rows.map((r)=>`
      <div class="row tap" data-rcatopen="${esc(r.c.name)}"><span class="k" style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${typeColor(r.c.type)}"></span>${esc(r.c.name)}
        <span class="muted" style="font-size:11.5px">${esc(r.c.type)}</span></span>
        <span class="v ${r.v<0?'neg':'pos'}">${money(r.v, store.cur)}</span></div>`).join('')}</div>`
    : `<div class="hint" style="margin-top:0">Nothing this year.</div>`}
  </div>`;
}
/* The year in six figures. Money out is summed as it sits (negative) and
   shown as what left: Out, Taxes and Savings are the outflows, positive.
     Cash        = In − (Out + Taxes + Savings)   what stayed in cash
     Net worth   = In − (Out + Taxes)             savings still belong to you */
function yearFigures(sums){
  const byType = (types) => store.categories.filter((c)=>types.includes(c.type)).reduce((t,c)=>t+(sums.out[c.name]||0), 0);
  const inc = byType(['Income']), out = -byType(['Necessity','Optional','Misc']), tax = -byType(['Taxes']), sav = -byType(['Savings']);
  const r2 = (v) => Math.round(v*100)/100;
  return { in:r2(inc), out:r2(out), tax:r2(tax), sav:r2(sav), cash:r2(inc-(out+tax+sav)), nw:r2(inc-(out+tax)) };
}
/* The ? on a box: what the figure is, and the numbers it was made of. */
const EXPLAIN = {
  in:   { label:'In',               text:'Sum of all the Income categories.',                         types:['Income'] },
  out:  { label:'Out',              text:'Sum of all the Necessity, Optional and Misc categories.',   types:['Necessity','Optional','Misc'], flip:true },
  tax:  { label:'Taxes',            text:'Sum of all the Taxes categories.',                          types:['Taxes'], flip:true },
  sav:  { label:'Savings',          text:'Sum of all the Savings categories.',                        types:['Savings'], flip:true },
  cash: { label:'Cash',             text:'In − (Out + Taxes + Savings).',                             parts:['in','out','tax','sav'] },
  nw:   { label:'Net worth change', text:'In − (Out + Taxes).',                                       parts:['in','out','tax'] },
};
function explainSheet(which){
  const e = EXPLAIN[which]; if (!e) return '';
  const Y = theYear(), sums = sumsByCategory(Y), f = yearFigures(sums);
  const rows = e.types
    ? store.categories.filter((c)=>e.types.includes(c.type) && sums.out[c.name]).map((c)=>[c.name, (e.flip?-1:1)*sums.out[c.name], typeColor(c.type)])
        .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))
    : e.parts.map((k)=>[EXPLAIN[k].label, (k==='in'?1:-1)*f[k], null]);
  return `
  <div class="sheetwrap">
    <div class="scrim" data-explainclose="1"></div>
    <div class="sheet${state.page.fresh?' enter':''}">
      <h3>${e.label} <span class="muted" style="font-size:12px;font-weight:600">${Y}</span></h3>
      <div class="hint" style="margin:0 0 6px">${e.text}</div>
      ${rows.length ? `<div class="rows">${rows.map(([name,v,col])=>`
        <div class="row"><span class="k" style="display:flex;align-items:center;gap:8px">${col?`<span class="dot" style="background:${col}"></span>`:''}${esc(name)}</span>
          <span class="v">${money(v, store.cur)}</span></div>`).join('')}
        <div class="row"><span class="k"><b>${esc(e.label)}</b></span><span class="v"><b>${money(f[which], store.cur)}</b></span></div></div>`
      : `<div class="hint" style="margin:0">Nothing this year.</div>`}
      <div class="foot"><button class="btn close" style="flex:1" data-explainclose="1">Close</button></div>
    </div>
  </div>`;
}
/* How much of the year has gone: twelve for a past year, the months elapsed
   for this one - the current month counted by the day, so the per-month
   figure does not swing on the 1st. */
function monthsIn(year){
  if (year < THIS_YEAR) return 12;
  if (year > THIS_YEAR) return 1;
  const d = new Date();
  const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return Math.max(0.5, d.getMonth() + d.getDate()/days);
}
function summaryCard(Y){
  const f = yearFigures(sumsByCategory(Y));
  const div = monthsIn(Y);
  const box = (label, v, color, key) => `<div class="kpi"><button class="qbtn" data-explain="${key}">?</button><div class="l">${label}</div><div class="v" style="color:${color}">${money(v, store.cur)}</div><div class="m">${money(Math.round(v/div*100)/100, store.cur)}/mo</div></div>`;
  return `
  <div class="card">
    <h2>Summary <span class="muted" style="text-transform:none;letter-spacing:0">${Y}</span></h2>
    <div class="kpis">
      ${box('In', f.in, 'var(--good)', 'in')}${box('Out', f.out, 'var(--bad)', 'out')}${box('Taxes', f.tax, 'var(--txt)', 'tax')}
    </div>
    <div class="kpis" style="margin-top:6px">
      ${box('Savings', f.sav, 'var(--accent)', 'sav')}${box('Cash', f.cash, f.cash<0?'var(--bad)':'var(--good)', 'cash')}${box('Net worth change', f.nw, 'var(--txt)', 'nw')}
    </div>
  </div>`;
}
/* The year's operations that touch a category - through the main tag or a
   secondary one - and how much of each belongs to it (a secondary tag's
   part, or the whole less the parts), in the shown currency. */
function categoryOps(name, year){
  const out = [];
  for (const a of store.accounts) for (const o of opsOf(a.key)) {
    if (o.date.slice(0,4)!==String(year)) continue;
    let part = 0, hit = false;
    for (const sp of o.splits) if ((catOfTag(sp.tag)||{}).name===name) { part += sp.amount; hit = true; }
    if ((catOfTag(o.tag)||{}).name===name) { part += o.amount - o.splits.reduce((t,sp)=>t+sp.amount, 0); hit = true; }
    if (hit) out.push({ o, a, part: conv(part, a.currency, store.cur, o.date.slice(0,7)) || 0 });
  }
  return out;
}
function categoryPage(c){
  const Y = theYear();
  const f = opFilter();
  const all = categoryOps(c.name, Y);
  const total = Math.round(all.reduce((t,x)=>t+x.part, 0)*100)/100;
  const months = MON.map((m,i)=>Y+'-'+String(i+1).padStart(2,'0'));
  const perMonth = months.map((m)=>Math.round(all.filter((x)=>x.o.date.slice(0,7)===m).reduce((t,x)=>t+x.part, 0)*100)/100);
  const selM = state.catMonths.filter((m)=>months.includes(m));
  const pool = selM.length ? all.filter((x)=>selM.includes(x.o.date.slice(0,7))) : all;
  const byId = Object.fromEntries(pool.map(({o,a})=>[o.id, a]));
  const shown = filterOps(pool.map(({o})=>o), f).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0).map((o)=>({ o, a:byId[o.id] }));
  const p = state.page;
  return (p && p.kind==='op' ? opSheet(p, opAcct()) : '') + `
  <div class="card">
    <h2><span style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt)"><span class="dot" style="background:${typeColor(c.type)}"></span>${esc(c.name)}</span>
      <span class="muted" style="text-transform:none;letter-spacing:0">${esc(c.type)} · ${Y}</span></h2>
    <div class="hero ${total<0?'neg':'pos'}">${money(total, store.cur)}</div>
  </div>
  <div class="card">
    <h2>By month${selM.length?` <span class="muted" style="text-transform:none;letter-spacing:0">${selM.map((m)=>MON[+m.slice(5,7)-1]).join(', ')}</span>`:''}</h2>
    ${columns({ labels:MON, values:perMonth, color:typeColor(c.type), keys:months, dataAttr:'data-rcatmonth', selected:selM })}
  </div>
  <div class="card">
    <h2>Operations
      <span class="fbar"><span class="muted" id="opCount">${shown.length}${filterActive(f)?' · '+money(Math.round(shown.reduce((t,{o,a})=>t+(conv(o.amount, a.currency, store.cur, o.date.slice(0,7))||0),0)*100)/100, store.cur):''}</span>
        <span class="fdrop"><button class="fbtn ${filterActive(f)?'act':''}" data-fopen="1">🔍</button>${f.open?filterMenu(f):''}</span></span></h2>
    ${filterChips(f)}
    <div id="opsList">${opRowsMixed(shown)}</div>
  </div>
  <div style="height:56px"></div>
  ${selBar(true)}
  <div class="closebar"><button class="btn" data-rcatclose="1">Close</button></div>`;
}
function tabReport(){
  const Y = theYear();

/* ---------------------------------------------------------------- history --
   Net worth month by month, each month at its own rate, on the zoomable
   chart. */
function netWorthMonths(){
  let first = null;
  for (const k of Object.keys(store.ops)) for (const o of store.ops[k]) { const m = o.date.slice(0,7); if (!first || m < first) first = m; }
  if (!first) return [];
  const now = new Date().toISOString().slice(0,7);
  const out = [];
  for (let y = +first.slice(0,4), mo = +first.slice(5,7); y+'-'+String(mo).padStart(2,'0') <= now; ) {
    const m = y+'-'+String(mo).padStart(2,'0');
    const end = m + '-31';
    let total = 0;
    for (const a of counted()) {
      const bal = (+a.opening||0) + opsOf(a.key).filter((o)=>o.date <= end).reduce((t,o)=>t+o.amount, 0);
      const v = conv(bal, a.currency, store.cur, m); if (v!=null) total += v;
    }
    out.push({ label: mLabel(m), values: { nw: Math.round(total) } });
    mo++; if (mo > 12) { mo = 1; y++; }
  }
  return out;
}
function tabHistory(){
  const pts = netWorthMonths();
  const n = pts.length;
  if (n < 2) return `<div class="card"><h2>Net worth</h2><div class="hint" style="margin-top:0">Nothing yet.</div></div>`;
  if (state.nwHi==null || state.nwHi > n-1 || state.nwHi < 1) state.nwHi = n-1;
  if (state.nwLo==null || state.nwLo >= state.nwHi) state.nwLo = 0;
  return `

  </div>`;
}

   + opens a new operation. */
/* An operation's tags, main and secondary, and whether a filter names one
   of them - by tag or by the category the tag sits in. */
const opTags = (o) => [o.tag].concat(o.splits.map((sp)=>sp.tag)).filter(Boolean);
const opHits = (o, f) => opTags(o).some((t)=> f.kind==='tag' ? same(t, f.name) : (catOfTag(t)||{}).name===f.name);
function filterOps(ops, f){
  const q = f.q.trim().toLowerCase(), min = num(f.min), max = num(f.max);
  return ops.filter((o)=>{
    if (q && !(o.name.toLowerCase().includes(q) || (o.note||'').toLowerCase().includes(q) || opTags(o).some((t)=>t.toLowerCase().includes(q)))) return false;
    if (isFinite(min) && Math.abs(o.amount) < min) return false;
    if (isFinite(max) && Math.abs(o.amount) > max) return false;
    if (f.dir==='in' && o.amount <= 0) return false;
    if (f.dir==='out' && o.amount >= 0) return false;
    if (f.inc.length && !f.inc.some((x)=>opHits(o, x))) return false;
    if (f.exc.some((x)=>opHits(o, x))) return false;
    return true;
  }).sort((x,y)=>{
    let v = 0;
    if (f.sort==='name') v = x.name.localeCompare(y.name);
    else if (f.sort==='amount') v = Math.abs(x.amount) - Math.abs(y.amount);
    else if (f.sort==='tag') v = (((catOfTag(x.tag)||{}).name||'~') + '|' + x.tag).localeCompare(((catOfTag(y.tag)||{}).name||'~') + '|' + y.tag);
    if (v===0) v = x.date < y.date ? -1 : x.date > y.date ? 1 : 0;
    return f.desc ? -v : v;

}

const rateRows = (tab) => ((tab && tab.rows) || []).map((r) => ({

/* USD per one unit of each currency, for one month's row. */
const usdPer = (r) => ({ USD:1, EUR:r.eur, AUD:r.aud });
/* How much of `to` one unit of `base` buys, that month. */
const rateOf = (r, base, to) => usdPer(r)[base] / usdPer(r)[to];
const mLabel = (m) => MON[+m.slice(5,7)-1] + ' ' + m.slice(0,4);

/* ---------------------------------------------------- a chart with a zoom --
   REUSABLE. Lines over time with a double slider under them: the left thumb
   is the start, the right thumb the end. Dragging redraws the plot alone -
   never the sliders, because re-rendering the input under a finger cancels
   the drag. One axis for every series; each line is labelled at its end.

     pts     [{ label, values:{ key: number } }]  in time order
     series  [{ key, label, color }]
     lo, hi  indices into pts, inclusive                                     */
function rangeChart(id, pts, series, lo, hi){
  const n = pts.length;
  return `
  <div class="legend">${series.map((sr)=>`<span><i style="background:${sr.color}"></i>${esc(sr.label)}</span>`).join('')}</div>
  <div id="${id}Plot">${rangePlot(pts, series, lo, hi)}</div>
  <div class="dslider">
    <input type="range" id="${id}Lo" min="0" max="${n-1}" value="${lo}">
    <input type="range" id="${id}Hi" min="0" max="${n-1}" value="${hi}">
  </div>
  <div class="drange"><span id="${id}LoLab">${esc(pts[lo]?pts[lo].label:'')}</span><span id="${id}HiLab">${esc(pts[hi]?pts[hi].label:'')}</span></div>`;
}
function rangePlot(pts, series, lo, hi){
  const W=352, H=160, T=10, B=18, L=36, R=8;
  const shown = pts.slice(lo, hi+1);
  const n = shown.length;
  if (n < 2) return `<div class="hint" style="margin-top:0">Widen the range.</div>`;
  const vals = shown.flatMap((p)=>series.map((sr)=>p.values[sr.key])).filter((v)=>v>0);
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max-min || max*0.05 || 1) * 0.08; min -= pad; max += pad;
  const x = (i) => L + (W-L-R) * i / (n-1);
  const y = (v) => T + (H-T-B) * (1 - (v-min)/(max-min));
  let g = '';
  for (let k=0;k<3;k++){ const v = min + (max-min)*k/2; const yy = y(v);
    g += `<line class="gl" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>
      <text class="yl" x="${L-4}" y="${(yy+3).toFixed(1)}" text-anchor="end">${v.toFixed(2)}</text>`; }
  const ticks = n > 4 ? [0, Math.round((n-1)/2), n-1] : [0, n-1];
  for (const i of ticks) g += `<text class="tick" x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(shown[i].label)}</text>`;
  for (const sr of series) {
    const d = shown.map((p,i)=>`${x(i).toFixed(1)},${y(p.values[sr.key]).toFixed(1)}`).join(' ');
    const last = shown[n-1].values[sr.key];
    g += `<polyline points="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    /* The value at the end of the line, white on a dark halo so it reads
       against the line itself; whole numbers for money, four decimals for rates. */
    g += `<text class="endlab" x="${(W-R).toFixed(1)}" y="${(y(last)-6).toFixed(1)}" text-anchor="end">${Math.abs(last)>=100 ? Math.round(last).toLocaleString('en-US') : last.toFixed(4)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
/* REUSABLE. Columns, one per label, in one colour; the selected ones white,
   their labels too. The hit area is the whole column height, label included,
   so a month with almost nothing in it is still a target. */
function columns({ labels, values, color, keys, dataAttr, selected }){
  const W=352, H=150, T=14, B=16;
  const ih=H-T-B, n=labels.length||1;
  const max=Math.max(1,...values.map((v)=>Math.abs(v)));
  const step=W/n, bw=Math.min(24, step*0.62);
  const sel = new Set(selected||[]);
  let g=`<line class="gl" x1="0" y1="${T+ih}" x2="${W}" y2="${T+ih}"/>`;
  labels.forEach((lab,i)=>{
    const v=Math.abs(values[i]||0), cx=step*i+step/2, h=v/max*ih, y=T+ih-h;
    const on = keys && sel.has(keys[i]);
    if (keys && dataAttr) g+=`<rect x="${(cx-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent" class="bar" ${dataAttr}="${esc(keys[i])}"/>`;
    if (h>0.4) g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="3" fill="${on?'#fff':color}" pointer-events="none"/>`;
    if (v > max*0.06) g+=`<text class="vlab" x="${cx.toFixed(1)}" y="${(y-3.5).toFixed(1)}" text-anchor="middle" pointer-events="none">${kfmt(v)}</text>`;
    g+=`<text class="tick${on?' sel':''}" x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle" pointer-events="none">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* Wires the two thumbs: left never passes right; the plot and the two date
   labels are redrawn in place. */
function wireRangeChart(id, pts, series, get, set){
  const lo=document.getElementById(id+'Lo'), hi=document.getElementById(id+'Hi');
  if (!lo || !hi) return;
  const redraw=()=>{ const r=get();
    const plot=document.getElementById(id+'Plot'); if (plot) plot.innerHTML = rangePlot(pts, series, r.lo, r.hi);
    const a=document.getElementById(id+'LoLab'), b=document.getElementById(id+'HiLab');
    if (a) a.textContent = pts[r.lo] ? pts[r.lo].label : ''; if (b) b.textContent = pts[r.hi] ? pts[r.hi].label : ''; };
  lo.oninput=()=>{ const r=get(); let v=+lo.value; if (v > r.hi-1) { v=r.hi-1; lo.value=v; } set(v, r.hi); redraw(); };
  hi.oninput=()=>{ const r=get(); let v=+hi.value; if (v < r.lo+1) { v=r.lo+1; hi.value=v; } set(r.lo, v); redraw(); };
}

/* Today's rate, straight from the ECB feed, refreshed on every open. It is
   what current balances are converted with; the month-end table is history
   and never moves. Kept in the store so the app opens offline with the last
   one it saw. */
async function refreshLive(){
  try {
    const res = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,AUD');
    if (!res.ok) return false;
    const j = await res.json();
    if (!j.rates || !j.rates.EUR || !j.rates.AUD) return false;
    store.live = { date:j.date, eur:Math.round(1e6/j.rates.EUR)/1e6, aud:Math.round(1e6/j.rates.AUD)/1e6, at:new Date().toISOString() };
    save();
    return true;
  } catch (e) { return false; }
}

/* Nothing animates on a tap. The page scrolls to the top only when the
   bottom tab changes; every other redraw keeps its place - the content area
   holds its height while it is swapped, so the page cannot shorten for a
   frame and drag the scroll position with it. */
let lastTab = null, lastWhere = null;
function render(){
  const moved = state.tab !== lastTab;
  lastTab = state.tab;
  /* A selection belongs to the list it was made in. */
  const where = [state.tab, (state.sub||{})[state.tab]||'', state.account||'', state.budget||'', state.cat||''].join('|');
  if (where !== lastWhere) { state.sel=[]; state.bulk=null; }
  lastWhere = where;
  renderNav();
  /* The version in the top bar, so a phone that has not picked up a deploy is
     obvious at a glance. */
  document.getElementById('hdrRight').textContent = 'v' + APP_VERSION;
  const ct = document.getElementById('curTog');
  ct.innerHTML = ['USD','EUR'].map((c)=>`<button class="${store.cur===c?'on':''}" data-cur="${c}">${SYM[c]}</button>`).join('');
  const ys = years(), Y = theYear();
  document.getElementById('yearStep').innerHTML =
    `<button data-yearstep="-1" ${Y<=ys[0]?'disabled':''}>‹</button><b>${Y}</b><button data-yearstep="1" ${Y>=ys[ys.length-1]?'disabled':''}>›</button>`;
  const tabs = document.getElementById('tabs');
  if (!moved && tabs.offsetHeight) tabs.style.minHeight = tabs.offsetHeight + 'px';
  tabs.innerHTML = `<div class="tab">${SCREENS[state.tab]()}</div>`;
  wire();
  if (moved) scrollTo({ top:0 });
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(()=>{ tabs.style.minHeight=''; });
  else tabs.style.minHeight='';
}

/* TEMPORARY, for testing: throw away the service worker and every cache,
   then reload from the network, so a fresh deploy is picked up on the spot. */
async function hardReload(){
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (typeof caches !== 'undefined') for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* nothing to clear */ }
  location.reload();
}

function wire(){
  document.querySelectorAll('[data-reload]').forEach((el)=>el.onclick=hardReload);
  document.querySelectorAll('[data-tab]').forEach((el)=>el.onclick=()=>{ state.tab=el.dataset.tab; state.page=null; state.account=null; state.budget=null; state.cat=null; state.opf=null; render(); });
  document.querySelectorAll('[data-cur]').forEach((el)=>el.onclick=()=>{ store.cur=el.dataset.cur; save(); render(); });
  document.querySelectorAll('[data-yearstep]').forEach((el)=>el.onclick=()=>{ const ys=years(); const i=ys.indexOf(theYear())+(+el.dataset.yearstep);
    if (i>=0 && i<ys.length) { state.year=ys[i]; state.page=null; render(); } });
  document.querySelectorAll('[data-set]').forEach((el)=>el.onclick=()=>{ state.settings=el.dataset.set; state.page=null; render(); });

  /* an unfiled tag, filed from its row */
  document.querySelectorAll('[data-file]').forEach((el)=>el.onchange=()=>{
    const c = store.categories.find((x)=>x.name===el.value); if (!c) return;
    if (!c.tags.some((t)=>same(t, el.dataset.file))) c.tags.push(el.dataset.file);
    commit(); });

  /* categories - the widget */
  const readCat=()=>{ const n=document.getElementById('cName'), t=document.getElementById('cTagIn');
    if (n) state.page.name=n.value; if (t) state.page.draft=t.value; state.page.closeArm=false; state.page.delArm=false; };
  const openCat=(index)=>{ const c=index==null?null:store.categories[index];
    const extras = c ? withoutName(c.name, c.tags) : [];
    state.page={ kind:'cat', index, name:c?c.name:'', type:c?c.type:'Necessity', tags:extras.slice(), draft:'',
      was:{ name:c?c.name:'', type:c?c.type:'Necessity', tags:extras.slice() }, closeArm:false, focus:false, fresh:true };
    render(); state.page.fresh=false; };
  /* A tag is added on Enter (or a comma); the field stays ready for the next.
     Backspace on an empty field takes the last capsule back. */
  const addTag=()=>{ const p=state.page; const t=(p.draft||'').replace(/,/g,'').trim();
    if (t && !p.tags.some((x)=>same(x,t)) && !same(t, p.name)) p.tags.push(t);
    p.draft=''; p.focus=true; render(); };
  document.querySelectorAll('[data-catnew]').forEach((el)=>el.onclick=()=>openCat(null));
  document.querySelectorAll('[data-catedit]').forEach((el)=>el.onclick=()=>openCat(+el.dataset.catedit));
  document.querySelectorAll('[data-cattype]').forEach((el)=>el.onclick=()=>{ readCat(); state.page.type=el.dataset.cattype; render(); });
  /* The name capsule follows the name as it is typed - no redraw, the field
     you are typing in must stay put. */
  const cn=document.getElementById('cName'), cap=document.getElementById('cNameCap');
  if (cn && cap) cn.oninput=()=>{ state.page.name=cn.value; state.page.closeArm=false; cap.textContent=cn.value.trim()||'—'; };
  const tagIn=document.getElementById('cTagIn');
  if (tagIn && state.page && state.page.kind==='cat') {
    tagIn.onkeydown=(e)=>{
      if (e.key==='Enter' || e.key===',') { e.preventDefault(); readCat(); addTag(); }
      else if (e.key==='Backspace' && !tagIn.value && state.page.tags.length) { readCat(); state.page.tags.pop(); state.page.focus=true; render(); }
    };
    tagIn.oninput=()=>{ state.page.draft=tagIn.value; state.page.closeArm=false; };
    if (state.page.focus) { state.page.focus=false; tagIn.focus(); }
  }
  document.querySelectorAll('[data-tagbox]').forEach((el)=>el.onclick=()=>{ const t=document.getElementById('cTagIn'); if (t) t.focus(); });
  document.querySelectorAll('[data-tagdel]').forEach((el)=>el.onclick=(e)=>{ if (e&&e.stopPropagation) e.stopPropagation();
    readCat(); state.page.tags.splice(+el.dataset.tagdel,1); state.page.focus=true; render(); });
  document.querySelectorAll('[data-catsave]').forEach((el)=>el.onclick=()=>{
    readCat(); const p=state.page;
    /* Whatever is still typed in the tag field counts as a tag too. */
    const t=(p.draft||'').replace(/,/g,'').trim(); if (t && !p.tags.some((x)=>same(x,t))) p.tags.push(t); p.draft='';
    const name=p.name.trim(), tags=withName(name, p.tags);
    const cur = p.index==null ? null : store.categories[p.index];
    try { checkCategory(name, p.type, tags, cur); } catch (e) { alert(e.message); render(); return; }
    if (cur) Object.assign(cur, { name, type:p.type, tags });
    else store.categories.push({ name, type:p.type, tags });
    state.page=null; commit(); });
  /* Close: straight away if nothing was entered; otherwise red once, then gone. */
  document.querySelectorAll('[data-catclose]').forEach((el)=>el.onclick=()=>{
    const p=state.page; const n=document.getElementById('cName'), t=document.getElementById('cTagIn');
    if (n) p.name=n.value; if (t) p.draft=t.value;
    if (catDirty(p) && !p.closeArm) { p.closeArm=true; render(); return; }
    state.page=null; render(); });
  /* Delete: red once, then gone. Any other tap disarms it. */
  document.querySelectorAll('[data-catdelete]').forEach((el)=>el.onclick=()=>{
    const p=state.page; const n=document.getElementById('cName'), t=document.getElementById('cTagIn');

  document.querySelectorAll('[data-rcatmonth]').forEach((el)=>el.onclick=()=>{ const m=el.dataset.rcatmonth;
    state.catMonths = state.catMonths.includes(m) ? state.catMonths.filter((x)=>x!==m) : [...state.catMonths, m]; render(); });
  document.querySelectorAll('[data-explain]').forEach((el)=>el.onclick=()=>{ state.page={ kind:'explain', which:el.dataset.explain, fresh:true }; render(); state.page.fresh=false; });
  document.querySelectorAll('[data-explainclose]').forEach((el)=>el.onclick=()=>{ state.page=null; render(); });
  if (state.tab==='summary' && sub('summary')==='history') {
    const pts = netWorthMonths();
    if (pts.length > 1) wireRangeChart('nw', pts, [{ key:'nw', label:'Net worth', color:'#3b82f6' }], ()=>({ lo:state.nwLo, hi:state.nwHi }), (lo,hi)=>{ state.nwLo=lo; state.nwHi=hi; });
  }
  const ff=document.getElementById('fxFrom'), ft=document.getElementById('fxTo');
  if (ff) ff.onchange=()=>{ store.fxFrom=+ff.value; save(); };
  if (ft) ft.onchange=()=>{ store.fxTo=+ft.value; save(); };
  document.querySelectorAll('[data-fxfetch]').forEach((el)=>el.onclick=async()=>{
    if (ff) store.fxFrom=+ff.value; if (ft) store.fxTo=+ft.value;
    if (store.fxFrom > store.fxTo) { const t=store.fxFrom; store.fxFrom=store.fxTo; store.fxTo=t; }
    save();
    state.fx={ msg:'Fetching…' }; render();
    try {
      const j = await BK.rates(store.backend, store.fxFrom, store.fxTo);
      store.rates = rateRows({ rows: (j.rows||[]).map((r)=>[r.month, r.eur, r.aud, r.date]) });
      store.backendVersion=j.backend; save();
      state.fxLo=null; state.fxHi=null;        // new history: show all of it
      state.fx={ msg:store.rates.length+' months in the sheet' };
    } catch (e) { state.fx={ msg:e.message, bad:true }; }
    render(); });

  /* The fields save as you type, so leaving the tab loses nothing. */
  const u=document.getElementById('bkUrl'), t=document.getElementById('bkTok');
  if (u) u.oninput=()=>{ store.backend.url=u.value.trim(); save(); };
  if (t) t.oninput=()=>{ store.backend.token=t.value.trim(); save(); };
  document.querySelectorAll('[data-bktest]').forEach((el)=>el.onclick=async()=>{
    if (u) store.backend.url=u.value.trim();
    if (t) store.backend.token=t.value.trim();
    save();
    state.sync={ msg:'Testing…' }; render();
    try {
      const j = await BK.ping(store.backend);
      store.backendVersion=j.backend; save();
      state.sync={ msg:'Connected — backend v'+j.backend };
    } catch (e) { state.sync={ msg:e.message, bad:true }; }
    render(); });

  document.querySelectorAll('[data-install]').forEach((el)=>el.onclick=async()=>{
    if (INSTALL_EVT) { INSTALL_EVT.prompt(); try { await INSTALL_EVT.userChoice; } catch (e) {} INSTALL_EVT=null; render(); return; }
    alert('Browser menu › Install app (or Add to Home Screen).'); });
}

render();

/* A fresh install with a connected sheet takes its config from the sheet, so
   a second phone starts where the first left off. A store with anything in
   it is left alone - what is here wins until it is pushed. */
if (connected() && !store.categories.length && !store.people.length && !store.accounts.length && !store.budgets.length && !store.rates.length) {
  pullNow().then(()=>render()).catch(()=>{});
}
/* Today's rate, every open; redraw if the Currency tab is showing. */
refreshLive().then((ok)=>{ if (ok && state.tab==='settings' && state.settings==='fx') render(); });

/* The backend version shown in About is whatever the script answered last.
   Ask again on every start, so a redeploy - and a hard reload - shows. */
if (connected()) {
  BK.ping(store.backend).then((j)=>{ if (j.backend !== store.backendVersion) { store.backendVersion=j.backend; save(); render(); } }).catch(()=>{});
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
