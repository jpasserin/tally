<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<title>Tally</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  header h1{font-size:20px;margin:0;letter-spacing:.3px;}
  header h1 .dot{color:var(--accent)}
  header h1 .ver{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
  /* The year: first operation to last, stepped from the top bar. */
  .ystep{display:flex;align-items:center;gap:2px}
  .ystep button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:26px;height:26px;
    font-size:15px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
  .ystep button:disabled{opacity:.3;cursor:default}
  .ystep b{font-size:14px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  /* The preferred currency: one toggle, two halves. */
  .curtog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .curtog button{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:3px 10px;cursor:pointer;font-family:inherit}
  .curtog button.on{background:var(--accent);color:#fff}
  header .hdrright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
  .hdrbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:26px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .hdrbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hdrbtn:active{color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 9px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px;}
  .muted{color:var(--muted)}

  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  /* The sub-tab bar stays put under the header while the page scrolls. */
  .pillrow.sticky{position:sticky;top:45px;z-index:15;background:var(--bg);padding:2px 0 10px;margin:-2px 0 6px}

  /* A widget over the bottom half of the screen. */
  .sheetwrap{position:fixed;inset:0;z-index:40}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:var(--card);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-width:560px;margin:0 auto}
  /* Slides up once, when it opens; a redraw from a chip inside must not replay it. */
  .sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .foot{display:flex;gap:8px;padding-top:4px}
  .sheet .foot .btn.close{flex:0 0 auto;min-width:92px;background:var(--bg2)}
  .sheet .foot .btn.close.arm{background:var(--bad);border-color:var(--bad);color:#fff}
  /* An information sheet's Close stays in view however long the list. */
  .sheet .foot.stick{position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom));background:var(--card);
    padding-bottom:calc(12px + env(safe-area-inset-bottom));margin-bottom:calc(-12px - env(safe-area-inset-bottom))}
  table.fx tr.sum td{border-top:1px solid var(--line);font-weight:700}
  table.fx tr.sum + tr.sum td{border-top:0;font-weight:400;color:var(--muted)}
  .tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:3px 8px;cursor:text;min-height:30px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:90px;width:auto;background:none;border:0;padding:2px 2px}
  .cap .x{margin-left:6px;opacity:.65;cursor:pointer;font-weight:700}
  .cap.fixed{border-color:var(--accent);color:var(--accent2)}
  .hero{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
  /* Report rows: name, then two aligned columns - per month, and the sum. */
  .rrow{display:grid;grid-template-columns:1fr 82px 96px;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow .mo,.rgrp .mo{font-size:11px;color:var(--muted);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rrow .v,.rgrp .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rgrp{display:grid;grid-template-columns:82px 96px;gap:6px;text-transform:none;letter-spacing:0}
  /* Six figures for the year, three a row. */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kpi{background:var(--card2);border-radius:12px;padding:8px 9px;min-width:0;position:relative}
  table.fx td.neg{color:var(--bad)}
  .rulemark{color:var(--good);font-size:10.5px;font-weight:700}
  /* Accounts framed by the currency they sit in. */
  .cframe{border:1.5px solid;border-radius:12px;padding:0 9px;margin:5px 0}
  .cframe .row:last-child{border-bottom:0}
  .qbtn{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--muted);
    font-size:10px;font-weight:700;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
  .kpi .l{padding-right:18px}
  .kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .kpi .v{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .m{font-size:10.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* A single bar split by share, the percentage written in each part. */
  .pbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:10px;background:var(--bg2)}
  .pbar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06101c;min-width:0;overflow:hidden}
  .herosub{font-size:12px;color:var(--muted);margin-top:3px}
  .neg{color:var(--bad)!important} .pos{color:var(--good)}
  .row .v.neg,.row .v.pos{font-weight:700}
  /* The operations filter, Bench's pattern: one round button, a panel that
     drops under it, chips for what is active. */
  .fbar{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
  .fdrop{position:relative}
  .fbtn{width:34px;height:28px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0}
  .fbtn.act{border-color:var(--accent);color:var(--accent2)}
  .fscrim{position:fixed;inset:0;z-index:8}
  .fmenu{position:absolute;right:0;top:100%;z-index:9;margin-top:6px;width:min(320px,88vw);display:flex;flex-direction:column;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
    text-align:left;font-weight:400}
  .fsearch{position:relative;margin-bottom:6px}
  .fsearch input{padding-right:30px}
  .fsearch .fx{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px}
  .ovf-addf,.ovf-exclf{display:block;width:100%;text-align:left;background:none;border:none;font-size:13px;font-weight:600;padding:7px 9px;
    border-radius:7px;cursor:pointer;font-family:inherit}
  .ovf-addf{color:#4a9eff} .ovf-exclf{color:#ff5c6c}
  .fpick{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:2px 0 6px}
  .fpick button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12.5px;padding:6px 9px;cursor:pointer;font-family:inherit}
  .fpick button.cat{font-weight:700}
  .fpick button.tag{padding-left:22px;color:var(--muted)}
  .ovf-seg{padding:6px 2px 8px;border-top:1px solid var(--line)}
  .ovf-sort{display:flex;align-items:center;gap:6px;padding:8px 2px 2px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .ovf-sort select{flex:1;min-width:0}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
  .fchip{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .fchip.exc{background:#ff5c6c}
  .fchip.plain{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .fchip b{cursor:pointer;opacity:.75;font-weight:700}
  /* A page's Close, always at the bottom above the nav; the selection bar
     rises above it when both are there. */
  .closebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:14;margin:0 auto;max-width:528px;padding:0 12px}
  .closebar .btn{width:100%;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.45)}
  .selbar.raised{bottom:calc(116px + env(safe-area-inset-bottom))}
  .chart .bar{cursor:pointer}
  .chart .tick.sel{fill:#fff;font-weight:700}
  .chart .vlab{fill:var(--muted);font-size:8px}
  /* Select box on an operation row, and the bar that appears once some are. */
  .ck{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:inline-flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;cursor:pointer;margin-right:8px}
  .ck.on{background:var(--accent);border-color:var(--accent)}
  .selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;margin:0 auto;max-width:528px;
    display:flex;align-items:center;gap:7px;padding:9px 12px;background:rgba(24,27,36,.97);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.45);font-size:12.5px}
  .selbar>span,.selbar .selhead>span{flex:1;font-weight:600}
  .selbar .dot{flex:0 0 9px;width:9px;height:9px}
  .selbar.pick{flex-direction:column;align-items:stretch;gap:4px;padding:8px}
  .selbar .selpick{max-height:40vh;overflow:auto;display:flex;flex-direction:column}
  .selbar .selpick button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--txt);
    font-size:13px;padding:7px 9px;border-radius:7px;cursor:pointer;font-family:inherit}
  .selbar .selpick button.tag{padding-left:24px;color:var(--muted)}
  .selbar .selhead{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .bcap{font-size:10px;padding:1px 7px;margin-left:6px;vertical-align:1px;border-color:currentColor;color:currentColor}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .swatch.on{border-color:#fff}
  .bbar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:5px}
  .bbar i{display:block;height:100%;border-radius:4px}
  table.fx{border-collapse:collapse;width:100%;font-size:12.5px}
  table.fx th,table.fx td{padding:5px 4px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.fx th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  table.fx th:first-child,table.fx td:first-child{text-align:left}
  table.fx tr:last-child td{border-bottom:0}
  table.fx tr.muted td{color:var(--muted)}
  /* A line chart with a zoom: two thumbs on one track, only the thumbs take
     the finger, so the two inputs can sit on top of each other. */
  svg.chart{width:100%;height:auto;display:block}
  .chart .gl{stroke:var(--line);stroke-width:1}
  .chart .yl{fill:var(--muted);font-size:9.5px}
  .chart .tick{fill:var(--muted);font-size:9.5px}
  .chart .endlab{font-size:11px;font-weight:700;fill:#fff;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
  /* The track is drawn once, by the container; both inputs' own tracks are
     transparent, so neither thumb can sit behind the other input's line. */
  .dslider{position:relative;height:28px;margin-top:4px}
  .dslider::before{content:'';position:absolute;left:0;right:0;top:12px;height:4px;background:var(--line);border-radius:2px}
  .dslider input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none;outline:none;border:0;padding:0}
  .dslider input::-webkit-slider-runnable-track{height:4px;background:transparent}
  .dslider input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:2px solid #fff;margin-top:-9px;pointer-events:auto;cursor:pointer}
  .dslider input::-moz-range-track{height:4px;background:transparent}
  .dslider input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;pointer-events:auto}
  .drange{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;
    color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* The lock: dark and open, or blue and shut. */
  .lockbtn{flex:0 0 auto;width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--bg2)}
  .lockbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lockbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{margin-bottom:5px}
  .field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  input,select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:5px 10px;font-size:14px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-size:12.5px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}
  .row.tap{cursor:pointer}
  /* The handle to drag a row by; the row being dragged lifts a little. */
  .drag{color:var(--muted);font-size:18px;line-height:1;padding:4px 10px 4px 2px;cursor:grab;touch-action:none;user-select:none;flex:none}
  .row.lift{background:var(--card2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .row .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .row .chev{color:var(--muted);font-weight:700}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}
  .gbtn.ghost{background:none;color:var(--accent2);border-color:var(--line);font-weight:600;font-size:11.5px}
  .gbtn:disabled{opacity:.35;cursor:default}
  .locked .row.tap{cursor:default}
  .btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
  .btn.danger.arm{background:var(--bad);color:#fff}
  .act{color:var(--accent2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px 10px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .cap{font-size:11px;font-weight:600;border-radius:12px;padding:2px 8px;border:1px solid var(--line);color:var(--txt);background:var(--card2)}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,26,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10;}
  nav button{background:none;border:none;color:var(--muted);font-size:9.5px;display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;font-family:inherit}
  nav button svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  nav button.active{color:var(--accent)}
  /* A small warning sign over the Account icon while there are findings. */
  nav button .ico{position:relative;display:inline-block}
  nav button .navwarn{position:absolute;top:-5px;right:-9px;width:13px;height:13px;color:var(--warn)}
  nav button .navwarn svg{width:13px;height:13px;stroke:var(--warn);fill:var(--bg);stroke-width:2.4}

  /* The Settings sub-tabs: a bar like the bottom one, smaller, under the header. */
  .subnav{position:sticky;top:45px;z-index:15;display:flex;justify-content:space-around;background:var(--bg);
    border-bottom:1px solid var(--line);margin:-14px -16px 14px;padding:5px 0 6px}
  .subnav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;padding:2px 1px;flex:1;min-width:0;font-family:inherit}
  .subnav button svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .subnav button.active{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Tally<span class="dot">.</span> <span id="hdrRight" class="ver"></span></h1>
    <div class="ystep" id="yearStep"></div>
    <div class="hdrright"><span class="curtog" id="curTog"></span></div></header>
  <div id="tabs"></div>
</div>
<nav id="nav"></nav>

<script src="backend.js?v=110"></script>
<script>
const APP_VERSION="110";
const BK = window.TallyBackend;

/* ------------------------------------------------------------------ store --

  let lo = null, hi = null;
  for (const k of Object.keys(store.ops)) for (const o of store.ops[k]) { const y = +o.date.slice(0,4); if (!y) continue;
    lo = lo==null ? y : Math.min(lo, y); hi = hi==null ? y : Math.max(hi, y); }
  if (lo==null) return [THIS_YEAR];
  const out = []; for (let y = lo; y <= hi; y++) out.push(y); return out;
}
function theYear(){ const ys = years(); if (!ys.includes(state.year)) state.year = ys.includes(THIS_YEAR) ? THIS_YEAR : ys[ys.length-1]; return state.year; }
/* The balance as it stood at the end of a year - every operation up to its
   last day. The current year is simply everything. */
const balanceAt = (a, year) => year >= THIS_YEAR ? balanceOf(a) : valueAt(a, year+'-12-31');
/* Any account at the end of any day. */
const valueAt = (a, end) => isFund(a) ? fundValueAt(a, end) : isProp(a) ? propEquityAt(a, end) : isLife(a) ? lifeCashAt(a, end) : isBond(a) ? bondValueAt(a, end).shown : isOpt(a) ? optValueAt(a, end) : r2((+a.opening||0) + opsOf(a.key).filter((o)=>o.date <= end).reduce((t,o)=>t+o.amount, 0));
/* The rate for a month: that month's end from the sheet; failing that the
   latest month before it; for the current month, or when the sheet has
   nothing yet, today's live rate. Null when there is nothing at all. */
let rateMemo = new Map();   // month -> row, for one redraw (a list converts hundreds of amounts)
function rateRow(month){
  if (rateMemo.has(month)) return rateMemo.get(month);
  const now = new Date().toISOString().slice(0,7);
  let r;
  if (month >= now && store.live) r = store.live;
  else { let best = null; for (const x of store.rates) if (x.month <= month && (!best || x.month > best.month)) best = x; r = best || store.live || null; }
  rateMemo.set(month, r);

}
/* An amount in another currency, at a month's rate. Null when it cannot be. */
function conv(amount, from, to, month){

  const r = rateRow(month); if (!r) return null;
  return Math.round(amount * rateOf(r, from, to) * 100) / 100;
}
/* "(€10.00)" - or nothing when the currencies match or there is no rate. */
const paren = (amount, from, month) => { if (from===store.cur) return ''; const v = conv(amount, from, store.cur, month);

const under = (amount, from, month) => { if (from===store.cur) return ''; const v = conv(amount, from, store.cur, month);
  return v==null ? '' : `<div class="muted" style="font-size:11px;text-align:right">${money(v, store.cur)}</div>`; };
const SYM = { USD:'$', EUR:'€', AUD:'A$' };
const money = (v, cur) => (v<0?'-':'') + (SYM[cur]||'') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });

/* Budgets: a unique name, a colour, an amount if you like - in the currency

const BUDGET_COLORS = ['#3b82f6','#4ade80','#fbbf24','#f87171','#c155ba','#7cb8ff','#33a569','#b68320'];
const budgetOf = (name) => store.budgets.find((b)=>same(b.name, name)) || null;
/* Open ones first, then the closed, each group in its own order. */
const budgetsSorted = () => store.budgets.filter((b)=>!b.closed).concat(store.budgets.filter((b)=>b.closed));

const budgetsFor = (current) => store.budgets.filter((b)=>!b.closed || same(b.name, current||''));

/* The budget's amount in the shown currency, at the rate of the month it

const budgetAmountIn = (b) => b.amount==null ? null : conv(b.amount, b.currency, store.cur, (b.created||TODAY()).slice(0,7));
function checkBudget(b, skip){

function checkAccount(a, skip){

  if (!PEOPLE_TYPES.includes(type)) throw new Error('A type.');
  if (store.people.some((p)=>p!==skip && same(p.name, name))) throw new Error('"'+name+'" already exists.');

      .concat(store.people.map((p)=>row({ Kind:'person', Name:p.name, Type:p.type })))
      .concat((store.names||[]).map((n)=>row({ Kind:'name', Name:n.name, Tags:n.tags.join(', ') })))
      .concat((store.ibond||[]).map((r)=>row({ Kind:'ibond', Name:r.month, Rate:r.inflation, Amount:r.fixed })))
      .concat(store.accounts.map((a)=>row({ Kind:'account', Name:a.key, Type:a.type, Currency:a.currency, Owners:a.owners.join(', '), Category:a.category, Opening:a.opening||0, Closed:a.closed?'yes':'',

      .concat(store.accounts.filter(isFund).flatMap((a)=>fundsOf(a).map((f)=>row({ Kind:'fund', Name:f.name, Type:f.kind, Tags:f.index||'', Account:a.key }))))
      .concat(store.budgets.map((b)=>row({ Kind:'budget', Name:b.name, Currency:b.currency, Color:b.color, Amount:b.amount==null?'':b.amount, Date:b.created||'', Closed:b.closed?'yes':'' }))) };
}

/* Read by header name, so a column added later never shifts an older one. */
function readConfig(tab){

  const col = (r, h) => { const i = heads.indexOf(h); return i<0 ? '' : String(r[i]==null?'':r[i]).trim(); };

    if (kind==='person') people.push({ name, type: PEOPLE_TYPES.includes(type)?type:'Parent' });

      opening: isFinite(num(col(r,'Opening'))) ? num(col(r,'Opening')) : 0,
      closed: col(r,'Closed')==='yes', funds: [],

      ...(type==='Life' || type==='Options' ? { policy: (()=>{ try { const p = JSON.parse(col(r,'Policy')||'null'); return p && typeof p==='object' ? p : null; } catch (e) { return null; } })() } : {}),
      ...(type==='PEL' ? { opened: String(col(r,'Opened')||'').slice(0,10), rate: isFinite(num(col(r,'Rate'))) ? num(col(r,'Rate')) : null } : {}),
      ...(type==='Property' ? { bought: String(col(r,'Bought')||'').slice(0,10), share: isFinite(num(col(r,'Share'))) ? num(col(r,'Share')) : 100, mortgage: (()=>{ try { const m = JSON.parse(col(r,'Mortgage')||'null'); return m && m.principal ? m : null; } catch (e) { return null; } })() } : {}) });

      currency: CURRENCIES.includes(col(r,'Currency'))?col(r,'Currency'):'USD',
      amount: col(r,'Amount')!=='' && isFinite(num(col(r,'Amount'))) ? num(col(r,'Amount')) : null,
      created: /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(0,10) : TODAY(), closed: col(r,'Closed')==='yes' }); }

/* A tally-import file (xlsx2tally.py): accounts and their operations.

function previewImport(j){

  return (j.accounts||[]).filter((a)=>a.key).map((a)=>({ key:a.key, currency:a.currency, n:((j.ops&&j.ops[a.key])||[]).length,

function importFile(j){

  if (j.needs && +j.needs > +APP_VERSION) throw new Error('This file needs Tally v' + j.needs + '; this is v' + APP_VERSION + '. Reload to update, then import again.');

        ...(a.type==='PEL' ? { opened: /^\d{4}-\d{2}-\d{2}/.test(a.opened||'') ? a.opened.slice(0,10) : '', rate: isFinite(+a.rate) ? +a.rate : null } : {}),

/* The books' openings against what the app holds: the oldest book sets the
   account's opening; every later book gets an adjustment where it opens at
   something other than what the books before it left (their operations by
   the year in their id, so nothing depends on the order of import), or none
   where it agrees - an adjustment no longer needed goes. */
function reconcileOpenings(acc, touched){
  const years = Object.keys(acc.openings||{}).map(Number).sort((x,y)=>x-y);
  if (!years.length) return 0;
  const list = opsOf(acc.key), bookYear = (id) => { const m = /^(\d{4})-/.exec(String(id)); return m ? +m[1] : null; };
  let made = 0;
  if (acc.opening !== acc.openings[years[0]]) { acc.opening = acc.openings[years[0]]; touched.add('Config'); }
  for (const y of years) {
    const id = y+'-'+acc.key+'-opening', i = list.findIndex((x)=>x.id===id);
    if (y===years[0]) { if (i>=0) { list.splice(i, 1); touched.add(acc.key); } continue; }
    const before = r2(acc.opening + list.filter((o)=>{ const by = bookYear(o.id); return by==null ? o.date < y+'-01-01' : by < y; }).reduce((t,o)=>t+(o.amount||0), 0));
    const diff = r2(acc.openings[y] - before);
    if (Math.abs(diff) >= 0.01) {

/* Net worth at the end of each month of the year, each at its own rate;
   months still to come are left empty. */
/* Cash, savings and property stacked in each month's column - or one of
   them alone, from the buttons top right. */
function nwByMonthCard(Y){

/* ----------------------------------------------------------------- report --
   The year's operations summed per category, in the shown currency at each
   operation's month. A secondary tag takes its own part; the main tag keeps
   the rest. Tags no category claims are shown as Unfiled, not dropped. */
const catOfTag = (t) => store.categories.find((c)=>c.tags.some((x)=>same(x, t))) || null;
/* Money moving between accounts: a tag of a Transfer category, or the bare
   x. Never a figure of the Report. */
const isTransferTag = (t) => { const c = catOfTag(t); return c ? c.type==='Transfer' : same(t, 'x'); };
/* The Report reads the family's Cash-category accounts only: savings
   accounts, funds, property, the policy and the children's stay out. */
const reportAccounts = () => familyCash().filter((a)=>a.category==='Cash');
/* Older stores filed x under Misc, so transfers counted as spending. Once,
   at boot or after a pull: move x into a category of type Transfer. */
function tidyCategories(){
  if (!store.categories.length || store.categories.some((c)=>c.type==='Transfer')) return false;
  for (const c of store.categories) c.tags = c.tags.filter((t)=>!same(t, 'x'));
  store.categories = store.categories.filter((c)=>c.tags.length);
  const named = store.categories.find((c)=>same(c.name, 'Transfer') || same(c.name, 'Transfers'));
  if (named) { named.type = 'Transfer'; named.tags.push('x'); }
  else store.categories.push({ name:'Transfer', type:'Transfer', tags:['Transfer','x'] });
  return true;
}
const cashAccounts = () => store.accounts.filter((a)=>!ownValue(a));
/* Every category's total over a year ("2013") or a month ("2013-04"), in
   the shown currency at each operation's month's rate. */
const sumsByCategory = (year) => sumsFor(String(year));
function sumsFor(prefix){
  const out = {}; let unfiled = 0;
  for (const a of reportAccounts()) for (const o of opsOf(a.key)) {
    if (!o.date.startsWith(prefix)) continue;
    const m = o.date.slice(0,7);
    const parts = o.splits.map((sp)=>({ tag:sp.tag, amount:sp.amount }));
    parts.push({ tag:o.tag, amount: o.amount - o.splits.reduce((t,sp)=>t+sp.amount, 0) });
    for (const p of parts) {
      if (isTransferTag(p.tag)) continue;
      const v = conv(p.amount, a.currency, store.cur, m); if (v==null) continue;
      const c = catOfTag(p.tag);
      if (c) out[c.name] = (out[c.name]||0) + v; else unfiled += v;
    }
  }
  return { out, unfiled };
}
function reportGroup(title, types, sums){
  /* In the order the categories are kept in, not by size. */
  const rows = store.categories.filter((c)=>types.includes(c.type) && sums.out[c.name]).map((c)=>({ c, v:sums.out[c.name] }));
  const total = rows.reduce((t,r)=>t+r.v, 0);
  const div = monthsIn(theYear());
  const perMo = (v) => money(Math.round(v/div*100)/100, store.cur) + '/mo';
  return `
  <div class="card">
    <h2>${title} <span class="rgrp"><span class="mo">${perMo(total)}</span><span class="v ${total<0?'neg':'pos'}">${money(total, store.cur)}</span></span></h2>
    ${rows.length ? rows.map((r)=>`
      <div class="rrow tap" data-rcatopen="${esc(r.c.name)}"><span class="k" style="display:flex;align-items:center;gap:8px;min-width:0"><span class="dot" style="background:${typeColor(r.c.type)}"></span>${esc(r.c.name)}
        <span class="muted" style="font-size:11.5px">${esc(r.c.type)}</span></span>
        <span class="mo">${perMo(r.v)}</span><span class="v ${r.v<0?'neg':'pos'}">${money(r.v, store.cur)}</span></div>`).join('')
    : `<div class="hint" style="margin-top:0">Nothing this year.</div>`}
  </div>`;
}
/* The year in six figures. Money out is summed as it sits (negative) and
   shown as what left: Out, Taxes and Savings are the outflows, positive.
     Cash        = In − (Out + Taxes + Savings)   what stayed in cash
     Net worth   = In − (Out + Taxes)             savings still belong to you */
function yearFigures(sums){
  const byType = (types) => store.categories.filter((c)=>types.includes(c.type)).reduce((t,c)=>t+(sums.out[c.name]||0), 0);
  const inc = byType(['Income']), out = -byType(['Necessity','Optional','Misc']), tax = -byType(['Taxes']), sav = -byType(['Savings']);
  const r2 = (v) => Math.round(v*100)/100;
  return { in:r2(inc), out:r2(out), tax:r2(tax), sav:r2(sav), cash:r2(inc-(out+tax+sav)), nw:r2(inc-(out+tax)) };
}
/* The ? on a box: what the figure is, and the numbers it was made of. */
const EXPLAIN = {
  in:   { label:'In',               text:'Sum of all the Income categories.',                         types:['Income'] },
  out:  { label:'Out',              text:'Sum of all the Necessity, Optional and Misc categories.',   types:['Necessity','Optional','Misc'], flip:true },
  tax:  { label:'Taxes',            text:'Sum of all the Taxes categories.',                          types:['Taxes'], flip:true },
  sav:  { label:'Savings',          text:'Sum of all the Savings categories.',                        types:['Savings'], flip:true },
  cash: { label:'Cash',             text:'In − (Out + Taxes + Savings).',                             parts:['in','out','tax','sav'] },
  nw:   { label:'Net worth change', text:'In − (Out + Taxes).',                                       parts:['in','out','tax'] },
};
function explainSheet(which){
  const e = EXPLAIN[which]; if (!e) return '';
  const Y = theYear(), sums = sumsByCategory(Y), f = yearFigures(sums);
  const rows = e.types
    ? store.categories.filter((c)=>e.types.includes(c.type) && sums.out[c.name]).map((c)=>[c.name, (e.flip?-1:1)*sums.out[c.name], typeColor(c.type)])
    : e.parts.map((k)=>[EXPLAIN[k].label, (k==='in'?1:-1)*f[k], null]);
  return `
  <div class="sheetwrap">
    <div class="scrim" data-explainclose="1"></div>
    <div class="sheet${state.page.fresh?' enter':''}">
      <h3>${e.label} <span class="muted" style="font-size:12px;font-weight:600">${Y}</span></h3>
      <div class="hint" style="margin:0 0 6px">${e.text}</div>
      ${rows.length ? `<div class="rows">${rows.map(([name,v,col])=>`
        <div class="row"><span class="k" style="display:flex;align-items:center;gap:8px">${col?`<span class="dot" style="background:${col}"></span>`:''}${esc(name)}</span>
          <span class="v">${money(v, store.cur)}</span></div>`).join('')}
        <div class="row"><span class="k"><b>${esc(e.label)}</b></span><span class="v"><b>${money(f[which], store.cur)}</b></span></div></div>`
      : `<div class="hint" style="margin:0">Nothing this year.</div>`}
      <div class="foot"><button class="btn close" style="flex:1" data-explainclose="1">Close</button></div>
    </div>
  </div>`;
}
/* How much of the year has gone: twelve for a past year, the months elapsed
   for this one - the current month counted by the day, so the per-month
   figure does not swing on the 1st. */
function monthsIn(year){
  if (year < THIS_YEAR) return 12;
  if (year > THIS_YEAR) return 1;
  const d = new Date();
  const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return Math.max(0.5, d.getMonth() + d.getDate()/days);
}
function summaryCard(Y){
  const f = yearFigures(sumsByCategory(Y));
  const div = monthsIn(Y);
  const box = (label, v, color, key) => `<div class="kpi"><button class="qbtn" data-explain="${key}">?</button><div class="l">${label}</div><div class="v" style="color:${color}">${money(v, store.cur)}</div><div class="m">${money(Math.round(v/div*100)/100, store.cur)}/mo</div></div>`;
  return `
  <div class="card">
    <h2>Summary <span class="muted" style="text-transform:none;letter-spacing:0">${Y}</span></h2>
    <div class="kpis">
      ${box('In', f.in, 'var(--good)', 'in')}${box('Out', f.out, 'var(--bad)', 'out')}${box('Taxes', f.tax, 'var(--txt)', 'tax')}
    </div>
    <div class="kpis" style="margin-top:6px">
      ${box('Savings', f.sav, 'var(--accent)', 'sav')}${box('Cash', f.cash, f.cash<0?'var(--bad)':'var(--good)', 'cash')}${box('Net worth change', f.nw, 'var(--txt)', 'nw')}
    </div>
  </div>`;
}
/* Report ▸ History: each year's monthly average, category by category -
   the spending categories in one table, income, taxes and savings in the
   other. Outflows read positive, as in the Summary boxes; a category that
   never moved is left out. */
function historyTable(title, types){

  const rows = ys.map((y)=>{ const sums = sumsByCategory(y).out, div = monthsIn(y);
    return { y, vals: cats.map((c)=>r2((c.type==='Income' ? 1 : -1) * (sums[c.name]||0) / div)) }; });
  const keep = cats.map((c,i)=>rows.some((r)=>r.vals[i]) ? i : -1).filter((i)=>i>=0);

      <tbody>${rows.map((r)=>`<tr><td>${r.y}</td>${keep.map((i)=>`<td class="${r.vals[i]<0?'neg':''}">${r.vals[i]?money(r.vals[i], store.cur):'—'}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>` : `<div class="hint" style="margin-top:0">Nothing yet.</div>`}
  </div>`;
}
function tabReportHistory(){
  return historyTable('Spendings', ['Necessity','Optional','Misc']) + historyTable('Income, tax and savings', ['Income','Taxes','Savings']);

/* The Summary's six figures, month by month, with the year's total and the
   average per month under each column. */
function tabMonthly(){
  const Y = theYear();
  const now = new Date().toISOString().slice(0,7);
  const months = MON.map((m,i)=>Y+'-'+String(i+1).padStart(2,'0')).filter((m)=>m <= now);
  const rows = months.map((m)=>({ m, f: yearFigures(sumsFor(m)) }));

      <tbody>${rows.map((r)=>`<tr><td>${MON[+r.m.slice(5,7)-1]}</td>${cols.map(([k])=>cell(k, r.f[k])).join('')}</tr>`).join('')}

  </div>`;
  return table('In, out and taxes', [['in','In'],['out','Out'],['tax','Taxes']])
    + table('Savings, cash and net worth', [['sav','Savings'],['cash','Cash'],['nw','Net worth']]);
}
/* The year's operations that touch a category - through the main tag or a
   secondary one - and how much of each belongs to it (a secondary tag's
   part, or the whole less the parts), in the shown currency. */
function categoryOps(name, year){
  const out = [];
  for (const a of reportAccounts()) for (const o of opsOf(a.key)) {
    if (o.date.slice(0,4)!==String(year)) continue;
    let part = 0, hit = false;
    for (const sp of o.splits) if ((catOfTag(sp.tag)||{}).name===name) { part += sp.amount; hit = true; }
    if ((catOfTag(o.tag)||{}).name===name) { part += o.amount - o.splits.reduce((t,sp)=>t+sp.amount, 0); hit = true; }
    if (hit) out.push({ o, a, part: conv(part, a.currency, store.cur, o.date.slice(0,7)) || 0 });
  }
  return out;
}
function categoryPage(c){
  const Y = theYear();

  const months = MON.map((m,i)=>Y+'-'+String(i+1).padStart(2,'0'));

  const shown = filterOps(pool.map(({o})=>o), f).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0).map((o)=>({ o, a:byId[o.id] }));
  const p = state.page;

  return (p && p.kind==='op' ? opSheet(p, opAcct()) : '') + `
  <div class="card">
    <h2><span style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt)"><span class="dot" style="background:${typeColor(c.type)}"></span>${esc(c.name)}</span>
      <span class="muted" style="text-transform:none;letter-spacing:0">${esc(c.type)} · ${Y}</span></h2>

  </div>
  ${hist ? categoryHistory(c) : `
  <div class="card">
    <h2>By month${selM.length?` <span class="muted" style="text-transform:none;letter-spacing:0">${selM.map((m)=>MON[+m.slice(5,7)-1]).join(', ')}</span>`:''}${views}</h2>
    ${columns({ labels:MON, values:perMonth, color:typeColor(c.type), keys:months, dataAttr:'data-rcatmonth', selected:selM })}
  </div>
  <div class="card">
    <h2>Operations
      <span class="fbar"><span class="muted" id="opCount">${shown.length}${filterActive(f)?' · '+money(Math.round(shown.reduce((t,{o,a})=>t+(conv(o.amount, a.currency, store.cur, o.date.slice(0,7))||0),0)*100)/100, store.cur):''}</span>
        <span class="fdrop"><button class="fbtn ${filterActive(f)?'act':''}" data-fopen="1">🔍</button>${f.open?filterMenu(f):''}</span></span></h2>
    ${filterChips(f)}
    <div id="opsList">${opRowsMixed(shown)}</div>
  </div>`}
  <div style="height:56px"></div>
  ${selBar(true)}
  <div class="closebar"><button class="btn" data-rcatclose="1">Close</button></div>`;
}
/* A category over every year: its month-by-month amount on the zoomable
   chart (outflows read positive), then a table with each year's total and
   monthly average. */
function categoryMonths(c){
  const sign = c.type==='Income' ? 1 : -1;
  const out = [];
  for (const y of years().filter((y)=>y<=THIS_YEAR)) {
    const by = {};
    for (const x of categoryOps(c.name, y)) { const m = x.o.date.slice(0,7); by[m] = (by[m]||0) + x.part; }
    const last = y===THIS_YEAR ? new Date().getMonth()+1 : 12;
    for (let mo = 1; mo <= last; mo++) { const m = y+'-'+String(mo).padStart(2,'0'); out.push({ label: mLabel(m), values: { v: r2(sign*(by[m]||0)) } }); }
  }
  const first = out.findIndex((p)=>p.values.v);
  return first < 0 ? [] : out.slice(first);
}

}
function tabReport(){

/* ---------------------------------------------------------------- history --
   Net worth month by month, each month at its own rate, on the zoomable
   chart. */
/* Every month from the first record to now: the net worth - or one account
   category of it. */
function netWorthMonths(cat){
  let first = null;
  for (const k of Object.keys(store.ops)) for (const o of store.ops[k]) { const m = o.date.slice(0,7); if (!first || m < first) first = m; }
  if (!first) return [];
  const now = new Date().toISOString().slice(0,7);
  const out = [];
  for (let y = +first.slice(0,4), mo = +first.slice(5,7); y+'-'+String(mo).padStart(2,'0') <= now; ) {
    const m = y+'-'+String(mo).padStart(2,'0');
    const end = m + '-31';
    let total = 0;
    for (const a of counted()) {
      if (cat && a.category!==cat) continue;
      const v = conv(valueAt(a, end), a.currency, store.cur, m); if (v!=null) total += v;
    }
    out.push({ label: mLabel(m), values: { nw: Math.round(total) } });
    mo++; if (mo > 12) { mo = 1; y++; }
  }
  return out;
}
/* The History chart: all of it in red, or one category in its own colour. */
const nwHistCat = () => NW_CATS.includes(state.nwHist) ? state.nwHist : null;

/* Start, end and change over the range the slider shows. */
function nwKpis(pts, lo, hi){
  const a = pts[lo] ? pts[lo].values.nw : 0, b = pts[hi] ? pts[hi].values.nw : 0, d = b - a;
  const box = (label, v, color) => `<div class="kpi"><div class="l">${label}</div><div class="v" style="color:${color}">${money(v, store.cur)}</div></div>`;
  return box('Start', a, 'var(--txt)') + box('End', b, 'var(--txt)') + box('Change', d, d<0?'var(--bad)':'var(--good)');
}
/* Each year at its end (today for this one): cash, savings and property
   accounts, converted at that year's rate, and the net worth they make. */
function netWorthByYear(){
  return years().filter((y)=>y<=THIS_YEAR).reverse().map((Y)=>{
    const m = yearMonth(Y); const by = { Cash:0, Savings:0, Property:0 }; let total = 0;
    for (const a of counted()) { const v = conv(balanceAt(a, Y), a.currency, store.cur, m); if (v==null) continue; by[a.category] = (by[a.category]||0) + v; total += v; }
    return { Y, cash:r2(by.Cash), sav:r2(by.Savings), prop:r2(by.Property), total:r2(total) };
  });
}

/* One account: its balance and its operations, newest first. Edit (top
   right) opens the widget where only the owners and open/closed can change;
   + opens a new operation. */
/* An operation's tags, main and secondary, and whether a filter names one
   of them - by tag or by the category the tag sits in. */
const opTags = (o) => [o.tag].concat(o.splits.map((sp)=>sp.tag)).filter(Boolean);
const opHits = (o, f) => opTags(o).some((t)=> f.kind==='tag' ? same(t, f.name) : (catOfTag(t)||{}).name===f.name);
function filterOps(ops, f){
  const q = f.q.trim().toLowerCase(), min = num(f.min), max = num(f.max);
  return ops.filter((o)=>{
    if (q && !(o.name.toLowerCase().includes(q) || (o.note||'').toLowerCase().includes(q) || opTags(o).some((t)=>t.toLowerCase().includes(q)))) return false;
    if (isFinite(min) && Math.abs(o.amount) < min) return false;
    if (isFinite(max) && Math.abs(o.amount) > max) return false;
    if (f.from && o.date < f.from) return false;
    if (f.to && o.date > f.to) return false;
    if (f.dir==='in' && o.amount <= 0) return false;
    if (f.dir==='out' && o.amount >= 0) return false;
    if (f.inc.length && !f.inc.some((x)=>opHits(o, x))) return false;
    if (f.exc.some((x)=>opHits(o, x))) return false;
    return true;
  }).sort((x,y)=>{
    let v = 0;
    if (f.sort==='name') v = x.name.localeCompare(y.name);
    else if (f.sort==='amount') v = Math.abs(x.amount) - Math.abs(y.amount);
    else if (f.sort==='tag') v = (((catOfTag(x.tag)||{}).name||'~') + '|' + x.tag).localeCompare(((catOfTag(y.tag)||{}).name||'~') + '|' + y.tag);
    if (v===0) v = x.date < y.date ? -1 : x.date > y.date ? 1 : 0;
    return f.desc ? -v : v;
  });
}
const SORTS = [['date','Date'],['name','Name'],['amount','Amount'],['tag','Category / Tag']];

    </div>

function filterChips(f){

/* One operation row: the select box, the name with its budget capsule, the

function bondMonths(a, Y, end){

  const at = (ym) => { let shown = 0, earned = 0; for (const b of bondsHeld(a, ym+'-31')) { const w = bondWorth(b, ym); shown += w.shown; earned += w.earned; } return { shown:r2(shown), earned:r2(earned) }; };
  const rateOf = (ym) => { const rs = [...new Set(bondsHeld(a, ym+'-31').map((b)=>{ const n = Math.max(0, ymDiff(b.issue, ym)); return ibondRate(b.fixed, ymAdd(b.issue, Math.floor(n/6)*6)).rate; }))]; return rs.length===1 ? pct(rs[0]) : rs.length ? rs.map(pct).join(' / ') : '—'; };

    return { ym, rate:rateOf(ym), shown:v.shown, earned:v.earned, int:r2(v.earned-prev.earned-paid) }; });

function balanceHistory(a){

function transferCandidates(o, a){

      else { const v = conv(Math.abs(x.amount), b.currency, a.currency, x.date.slice(0,7)); close = v!=null && Math.abs(v - Math.abs(o.amount)) / Math.abs(o.amount) < 0.03; }

/* ---------------------------------------------------------- currencies --
   Accounts are in USD, EUR and AUD. The month-end rates live in the sheet's
   second tab, Rates, written once by the script and never changed; the app
   only reads them. Fetch fills the years chosen, from 2013 by default, and
   installs the monthly trigger that adds each month as it ends. */
const rateRows = (tab) => ((tab && tab.rows) || []).map((r) => ({
  month: String(r[0]||'').slice(0,7), eur: +r[1], aud: +r[2], date: String(r[3]||'').slice(0,10) }))
  .filter((r) => /^\d{4}-\d{2}$/.test(r.month) && r.eur > 0 && r.aud > 0);
const fx4 = (v) => (v > 0 ? v.toFixed(4) : '—');
/* USD per one unit of each currency, for one month's row. */
const usdPer = (r) => ({ USD:1, EUR:r.eur, AUD:r.aud });
/* How much of `to` one unit of `base` buys, that month. */
const rateOf = (r, base, to) => usdPer(r)[base] / usdPer(r)[to];
const mLabel = (m) => MON[+m.slice(5,7)-1] + ' ' + m.slice(0,4);

/* ---------------------------------------------------- a chart with a zoom --
   REUSABLE. Lines over time with a double slider under them: the left thumb
   is the start, the right thumb the end. Dragging redraws the plot alone -
   never the sliders, because re-rendering the input under a finger cancels
   the drag. One axis for every series; each line is labelled at its end.

     pts     [{ label, values:{ key: number } }]  in time order
     series  [{ key, label, color }]
     lo, hi  indices into pts, inclusive                                     */
function rangeChart(id, pts, series, lo, hi){
  const n = pts.length;
  return `
  <div class="legend">${series.map((sr)=>`<span><i style="background:${sr.color}"></i>${esc(sr.label)}</span>`).join('')}</div>
  <div id="${id}Plot">${rangePlot(pts, series, lo, hi)}</div>
  <div class="dslider">
    <input type="range" id="${id}Lo" min="0" max="${n-1}" value="${lo}">
    <input type="range" id="${id}Hi" min="0" max="${n-1}" value="${hi}">
  </div>
  <div class="drange"><span id="${id}LoLab">${esc(pts[lo]?pts[lo].label:'')}</span><span id="${id}HiLab">${esc(pts[hi]?pts[hi].label:'')}</span></div>`;
}
function rangePlot(pts, series, lo, hi){
  const W=352, H=160, T=10, B=18, L=36, R=8;
  const shown = pts.slice(lo, hi+1);
  const n = shown.length;
  if (n < 2) return `<div class="hint" style="margin-top:0">Widen the range.</div>`;
  const vals = shown.flatMap((p)=>series.map((sr)=>p.values[sr.key])).filter((v)=>isFinite(v));
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max-min || max*0.05 || 1) * 0.08; min -= pad; max += pad;
  const x = (i) => L + (W-L-R) * i / (n-1);
  const y = (v) => T + (H-T-B) * (1 - (v-min)/(max-min));
  const money = series.some((sr)=>sr.money);
  /* whole numbers for money, four decimals for rates */
  const lab = (v) => series[0].fmt ? series[0].fmt(v) : money || Math.abs(v)>=100 ? Math.round(v).toLocaleString('en-US') : v.toFixed(4);
  let g = '';
  for (let k=0;k<3;k++){ const v = min + (max-min)*k/2; const yy = y(v);
    g += `<line class="gl" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>
      <text class="yl" x="${L-4}" y="${(yy+3).toFixed(1)}" text-anchor="end">${money ? kfmt1(v) : series[0].fmt ? series[0].fmt(v) : v.toFixed(2)}</text>`; }
  const ticks = n > 4 ? [0, Math.round((n-1)/2), n-1] : [0, n-1];
  for (const i of ticks) g += `<text class="tick" x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(shown[i].label)}</text>`;
  for (const sr of series) {
    const d = shown.map((p,i)=>`${x(i).toFixed(1)},${y(p.values[sr.key]).toFixed(1)}`).join(' ');
    const first = shown[0].values[sr.key], last = shown[n-1].values[sr.key];
    g += `<polyline points="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    /* The values at both ends of the line, white on a dark halo so they read
       against the line itself. */
    g += `<text class="endlab" x="${L.toFixed(1)}" y="${(y(first)-6).toFixed(1)}" text-anchor="start">${lab(first)}</text>`;
    g += `<text class="endlab" x="${(W-R).toFixed(1)}" y="${(y(last)-6).toFixed(1)}" text-anchor="end">${lab(last)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
/* REUSABLE. Columns, one per label, in one colour; the selected ones white,
   their labels too. The hit area is the whole column height, label included,
   so a month with almost nothing in it is still a target. */
function columns({ labels, values, color, keys, dataAttr, selected, series }){
  const W=352, H=150, T=14, B=16;
  const ih=H-T-B, n=labels.length||1;
  /* one colour with `values`, or `series` [{values,color}] stacked; a part
     below zero is not drawn but still counts in the figure on top */
  const stack = series || [{ values, color }];
  const totals = labels.map((_,i)=>stack.reduce((t,sr)=>t+(sr.values[i]||0), 0));
  const max=Math.max(1,...labels.map((_,i)=>Math.max(Math.abs(totals[i]), stack.reduce((t,sr)=>t+Math.max(0, sr.values[i]||0), 0))));
  /* wide columns, thin gaps; the value above each in a small figure with one decimal */
  const step=W/n, bw=Math.min(30, step*0.84);
  const sel = new Set(selected||[]);
  let g=`<line class="gl" x1="0" y1="${T+ih}" x2="${W}" y2="${T+ih}"/>`;
  labels.forEach((lab,i)=>{
    const cx=step*i+step/2;
    const on = keys && sel.has(keys[i]);
    if (keys && dataAttr) g+=`<rect x="${(cx-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" fill="transparent" class="bar" ${dataAttr}="${esc(keys[i])}"/>`;
    let top = T+ih;
    if (series) {
      for (const sr of stack) { const v = Math.max(0, sr.values[i]||0), h = v/max*ih; if (h>0.4) { top -= h;
        g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h-1).toFixed(1)}" rx="2" fill="${sr.color}" pointer-events="none"/>`; } }
    } else {
      const v=Math.abs(values[i]||0), h=v/max*ih, y=T+ih-h;
      if (h>0.4) { top = y; g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="3" fill="${on?'#fff':color}" pointer-events="none"/>`; }
    }
    const v = Math.abs(totals[i]);
    if (v > max*0.06) g+=`<text class="vlab" x="${cx.toFixed(1)}" y="${(top-3.5).toFixed(1)}" text-anchor="middle" pointer-events="none">${kfmt1(v)}</text>`;
    g+=`<text class="tick${on?' sel':''}" x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle" pointer-events="none">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* Wires the two thumbs: left never passes right; the plot and the two date
   labels are redrawn in place. */
function wireRangeChart(id, pts, series, get, set, after){
  const lo=document.getElementById(id+'Lo'), hi=document.getElementById(id+'Hi');
  if (!lo || !hi) return;
  const redraw=()=>{ const r=get();
    const plot=document.getElementById(id+'Plot'); if (plot) plot.innerHTML = rangePlot(pts, series, r.lo, r.hi);
    const a=document.getElementById(id+'LoLab'), b=document.getElementById(id+'HiLab');
    if (a) a.textContent = pts[r.lo] ? pts[r.lo].label : ''; if (b) b.textContent = pts[r.hi] ? pts[r.hi].label : '';
    if (after) after(r); };
  lo.oninput=()=>{ const r=get(); let v=+lo.value; if (v > r.hi-1) { v=r.hi-1; lo.value=v; } set(v, r.hi); redraw(); };
  hi.oninput=()=>{ const r=get(); let v=+hi.value; if (v < r.lo+1) { v=r.lo+1; hi.value=v; } set(r.lo, v); redraw(); };
}
const FX_COLORS = { USD:'#3b82f6', EUR:'#4ade80', AUD:'#fbbf24' };
/* Today's rate, straight from the ECB feed, refreshed on every open. It is
   what current balances are converted with; the month-end table is history
   and never moves. Kept in the store so the app opens offline with the last
   one it saw. */
async function refreshLive(){
  try {
    const res = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,AUD');
    if (!res.ok) return false;
    const j = await res.json();
    if (!j.rates || !j.rates.EUR || !j.rates.AUD) return false;
    store.live = { date:j.date, eur:Math.round(1e6/j.rates.EUR)/1e6, aud:Math.round(1e6/j.rates.AUD)/1e6, at:new Date().toISOString() };
    save();
    return true;
  } catch (e) { return false; }
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    ${last12.length ? `<table class="fx">
      <thead><tr><th>Month</th>${others.map((c)=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${last12.map((r)=>`<tr><td>${mLabel(r.month)}</td>${others.map((c)=>`<td>${fx4(rateOf(r, base, c))}</td>`).join('')}</tr>`).join('')}</tbody>

/* A page one level down inside the tab: same chrome, a back link where the
   heading would be. Nothing slides up from the bottom. */
function settingsTags(){
  const p = state.page;
  return (p && p.kind==='cat' ? catSheet(p) : p && p.kind==='names' ? namesSheet(p) : p && p.kind==='name' ? nameSheet(p) : '') + `
  <div class="card">
    <h2>Categories <button class="gbtn" data-catnew="1"${LK()}>+</button></h2>
    ${store.categories.length ? `<div class="rows" id="catRows">${store.categories.map((c,i)=>`
      <div class="row tap ${state.dragIdx===i?'lift':''}" data-catedit="${i}" data-catrow="${i}">
        ${store.locked?'':`<span class="drag" data-catdrag="${i}">≡</span>`}
        <div style="flex:1;min-width:0">
          <div class="k" style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${typeColor(c.type)}"></span><b>${esc(c.name)}</b>
            <span class="muted" style="font-size:11.5px">${esc(c.type)}</span></div>
          ${c.tags.length?`<div class="caps">${c.tags.map((t)=>`<span class="cap">${esc(t)}</span>`).join('')}</div>`:''}
        </div>
        <span class="chev">›</span>
      </div>`).join('')}</div>`
    : `<div class="hint" style="margin-top:0">Nothing yet.</div>`}
  </div>
  ${knownNamesCard()}
  ${alwaysCard()}
  ${(function(){ const un = unfiledTags(); if (!un.length) return '';
    /* A tag with no category: pick one from the row and it is filed. */
    return `<div class="card">
    <h2>Unfiled <span class="muted" style="text-transform:none;letter-spacing:0">${un.length}</span></h2>
    <div class="rows">${un.map((u)=>`
      <div class="row">
        <div class="k"><b>${esc(u.tag)}</b> <span class="muted" style="font-size:11.5px">${u.n}</span></div>
        <select data-file="${esc(u.tag)}" style="width:auto;max-width:55%;padding:3px 8px;font-size:12.5px"${LK()}>
          <option value="">—</option>${store.categories.map((c)=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>
      </div>`).join('')}</div>
  </div>`; })()}`;
}
/* The widget: name, type, and a tag field that turns each Enter into a
   capsule. Close asks once (red) if anything was typed; Save is the wide blue
   one. Tapping the dark area behind counts as Close. */
const catDirty = (p) => p.name.trim()!==p.was.name || p.type!==p.was.type || p.tags.join('\u0001')!==p.was.tags.join('\u0001') || !!p.draft;
/* Known names: a payee and the tags it is known under - TMobile under Phone.
   A name may be known under several tags. Kept in Config as `name` rows. */
const knownNames = () => store.names || (store.names = []);
/* Names are matched on their words - lower case, accents gone, digits and
   punctuation turned into breaks - and a known name matches an operation
   whose name is it, or starts with it as whole words: "Trader Joe's" covers
   "TRADER JOE'S #036 QPS", "CAF" does not cover "Cafe Laurent". The longest
   known name that fits wins. */
const canonName = (s) => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]+/g, ' ').trim();
const fitsName = (c, k) => !!k && (c===k || c.startsWith(k+' ') || c.replace(/ /g, '')===k.replace(/ /g, ''));
function knownFor(name){
  const c = canonName(name); if (!c) return null;
  let best = null;
  for (const n of knownNames()) { const k = canonName(n.name); if (fitsName(c, k) && (!best || k.length > canonName(best.name).length)) best = n; }
  return best;
}
const nameTags = (name) => { const n = knownFor(name); return n ? n.tags : []; };
function learnName(name, tag){
  let n = knownNames().find((x)=>canonName(x.name)===canonName(name));
  if (!n) { n = { name:String(name).trim(), tags:[] }; knownNames().push(n); }
  if (!n.tags.some((t)=>same(t, tag))) n.tags.push(tag);
}
function forgetName(name, tag){
  const n = knownNames().find((x)=>canonName(x.name)===canonName(name)); if (!n) return;
  n.tags = n.tags.filter((t)=>!same(t, tag));
  if (!n.tags.length) store.names = knownNames().filter((x)=>x!==n);
}
/* The records' suggestions: every payee seen at least twice under a tag it
   is not yet known under, with the count and the tag's category. */
function suggestNames(){
  const count = {};
  for (const a of familyCash()) for (const o of opsOf(a.key)) { if (!o.name || !o.name.trim()) continue;
    for (const t of opTags(o)) { const c = catOfTag(t); if (!c || same(t, 'x')) continue;
      const k = canonName(o.name)+'|'+t.toLowerCase(); (count[k] = count[k] || { name:o.name.trim(), tag:c.tags.find((x)=>same(x, t)), cat:c.name, n:0 }).n++; } }
  return Object.values(count).filter((x)=>x.n >= 2 && !nameTags(x.name).some((t)=>same(t, x.tag))).sort((x,y)=>y.n-x.n || x.name.localeCompare(y.name));
}
/* Find, over every category: the records' suggestions grouped by category. */
function namesSheet(p){
  const picked = new Set(p.picked);
  const groups = store.categories.map((c)=>({ c, list: p.found.map((x,i)=>({ x, i })).filter(({x})=>x.cat===c.name) })).filter((g)=>g.list.length);
  return `
  <div class="sheetwrap">
    <div class="scrim" data-namesclose="1"></div>
    <div class="sheet${p.fresh?' enter':''}">
      <h3>Names in the records <span class="muted" style="font-size:12px;font-weight:600">${p.found.length} found${p.found.length?' · '+picked.size+' picked':''}</span>
        ${p.found.length?`<button class="gbtn ghost" style="margin-left:auto" data-namesall="1">${picked.size===p.found.length?'None':'All'}</button>`:''}</h3>
      ${p.found.length ? groups.map((g)=>`
      <div class="sub" style="display:flex;align-items:center;gap:7px;margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)"><span class="dot" style="background:${typeColor(g.c.type)}"></span>${esc(g.c.name)}</div>
      <div class="rows">${g.list.map(({x,i})=>`
      <div class="row tap" data-namepick="${i}">
        <span class="ck ${picked.has(i)?'on':''}">${picked.has(i)?'✓':''}</span>
        <div style="flex:1;min-width:0"><div class="k" style="font-weight:600">${esc(x.name)}</div><div class="sub">${esc(x.tag)}</div></div>
        <span class="v">${x.n}</span>
      </div>`).join('')}</div>`).join('') : `<div class="hint" style="margin:0 0 6px">No payee seen twice under a tag that is not known already.</div>`}
      <div class="foot stick"><button class="btn close" data-namesclose="1">Close</button>${p.found.length?`<button class="btn primary" data-namessave="1">Save ${picked.size}</button>`:''}</div>
    </div>
  </div>`;
}
/* The "Always correct" rules, for the one-time clean-up: tick the ones to
   turn into known names, or to drop. The group goes once none is left. */
const TRUST_TITLES = { creditspend:'Credit in a spending category', debitincome:'Debit in an income category', inconsistent:'Tagged unlike the same payee elsewhere' };
function alwaysCard(){
  const rules = trustRules(); if (!rules.length) return '';
  const sel = new Set(state.trustSel||[]);
  return `
  <div class="card">
    <h2>Always correct <span class="fbar"><span class="muted">${rules.length}</span>${store.locked?'':`<button class="gbtn ghost" data-trustall="1">${sel.size===rules.length?'None':'All'}</button>`}</span></h2>
    <div class="rows">${rules.map((r)=>`
      <div class="row tap" data-trustsel="${esc(r.key)}">
        ${store.locked?'':`<span class="ck ${sel.has(r.key)?'on':''}">${sel.has(r.key)?'✓':''}</span>`}
        <div style="flex:1;min-width:0"><div class="k" style="font-weight:600">${esc(r.name)} <span class="muted" style="font-size:11.5px">${esc(r.tag)}</span>${nameTags(r.name).some((t)=>same(t, r.tag))?' <span class="rulemark">✓</span>':''}</div>
          <div class="sub">${esc(TRUST_TITLES[r.kind]||r.kind)}</div></div>
      </div>`).join('')}</div>
    ${sel.size?`<div class="btnrow" style="margin-top:8px"><button class="btn danger ${state.trustArm==='bulk'?'arm':''}" style="flex:0 0 auto;min-width:92px" data-trustdrop="1">${state.trustArm==='bulk'?'Remove?':'Remove'}</button><button class="btn primary" data-trustknown="1">Make known · ${sel.size}</button></div>`:''}
  </div>`;
}
/* The Known names group: a name a row with its tags, searched by name and
   narrowed by category; a tap opens the name's widget. */
const nameShown = (n) => { const q = canonName(state.nmQ||''), c = state.nmCat;
  return (!q || canonName(n.name).includes(q)) && (!c || n.tags.some((t)=>(catOfTag(t)||{}).name===c)); };
const nameCount = (n) => { const k = canonName(n.name); let z = 0; for (const a of familyCash()) for (const o of opsOf(a.key)) if (fitsName(canonName(o.name), k)) z++; return z; };
/* The list, sorted by name or by count, up or down. */
function sortedNames(){
  const by = state.nmSort==='count' ? 'count' : 'name', desc = !!state.nmDesc;
  const list = knownNames().map((n)=>({ n, c: by==='count' ? nameCount(n) : 0 }));
  list.sort((x,y)=> by==='count' ? (x.c-y.c || x.n.name.localeCompare(y.n.name)) : x.n.name.localeCompare(y.n.name));
  if (desc) list.reverse();

/* Nothing animates on a tap. The page scrolls to the top only when the
   bottom tab changes; every other redraw keeps its place - the content area
   holds its height while it is swapped, so the page cannot shorten for a
   frame and drag the scroll position with it. */
let lastTab = null, lastWhere = null;
function render(){
  warnMemo = null; rateMemo = new Map();
  const moved = state.tab !== lastTab;
  lastTab = state.tab;
  /* A selection belongs to the list it was made in. */
  const where = [state.tab, (state.sub||{})[state.tab]||'', state.account||'', state.budget||'', state.cat||'', state.warnKind||''].join('|');
  if (where !== lastWhere) { state.sel=[]; state.bulk=null; }
  lastWhere = where;
  renderNav();
  /* The version in the top bar, so a phone that has not picked up a deploy is
     obvious at a glance. */
  document.getElementById('hdrRight').textContent = 'v' + APP_VERSION;
  const ct = document.getElementById('curTog');
  ct.innerHTML = ['USD','EUR'].map((c)=>`<button class="${store.cur===c?'on':''}" data-cur="${c}">${SYM[c]}</button>`).join('');
  const ys = years(), Y = theYear();
  document.getElementById('yearStep').innerHTML =
    `<button data-yearstep="-1" ${Y<=ys[0]?'disabled':''}>‹</button><b>${Y}</b><button data-yearstep="1" ${Y>=ys[ys.length-1]?'disabled':''}>›</button>`;
  const tabs = document.getElementById('tabs');
  if (!moved && tabs.offsetHeight) tabs.style.minHeight = tabs.offsetHeight + 'px';
  tabs.innerHTML = `<div class="tab${store.locked?' locked':''}">${SCREENS[state.tab]()}</div>`;
  wire();
  if (moved) scrollTo({ top:0 });
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(()=>{ tabs.style.minHeight=''; });
  else tabs.style.minHeight='';
}

/* TEMPORARY, for testing: throw away the service worker and every cache,
   then reload from the network, so a fresh deploy is picked up on the spot. */
async function hardReload(){
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (typeof caches !== 'undefined') for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* nothing to clear */ }
  location.reload();
}

function wire(){
  document.querySelectorAll('[data-reload]').forEach((el)=>el.onclick=hardReload);
  document.querySelectorAll('[data-tab]').forEach((el)=>el.onclick=()=>{ state.tab=el.dataset.tab; state.page=null; state.account=null; state.budget=null; state.cat=null; state.warnKind=null; state.opf=null; render(); });
  document.querySelectorAll('[data-cur]').forEach((el)=>el.onclick=()=>{ store.cur=el.dataset.cur; save(); render(); });
  document.querySelectorAll('[data-yearstep]').forEach((el)=>el.onclick=()=>{ const ys=years(); const i=ys.indexOf(theYear())+(+el.dataset.yearstep);
    if (i>=0 && i<ys.length) { state.year=ys[i]; state.page=null; render(); } });
  document.querySelectorAll('[data-set]').forEach((el)=>el.onclick=()=>{ state.settings=el.dataset.set; state.page=null; render(); });

  /* an unfiled tag, filed from its row */
  document.querySelectorAll('[data-file]').forEach((el)=>el.onchange=()=>{
    if (store.locked) return;
    const c = store.categories.find((x)=>x.name===el.value); if (!c) return;
    if (!c.tags.some((t)=>same(t, el.dataset.file))) c.tags.push(el.dataset.file);
    commit(); });

  /* categories - drag a row by its handle to reorder; pointer events on the
     document, so redrawing the list mid-drag does not drop the drag. */
  document.querySelectorAll('[data-catdrag]').forEach((el)=>{
    el.onclick=(e)=>{ if (e && e.stopPropagation) e.stopPropagation(); };
    el.onpointerdown=(e)=>{
      if (e && e.preventDefault) e.preventDefault(); if (e && e.stopPropagation) e.stopPropagation();
      state.dragIdx=+el.dataset.catdrag; state.dragMoved=false; render();
      const move=(ev)=>{
        const rows=[...document.querySelectorAll('[data-catrow]')];
        let to=state.dragIdx;
        rows.forEach((r)=>{ const b=r.getBoundingClientRect(); if (ev.clientY > b.top && ev.clientY < b.bottom) to=+r.dataset.catrow; });
        if (to!==state.dragIdx && moveCategory(state.dragIdx, to)) { state.dragIdx=to; state.dragMoved=true; render(); }
      };
      const up=()=>{ document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        const moved=state.dragMoved; state.dragIdx=null; state.dragMoved=false; if (moved) commit(); else render(); };
      if (document.addEventListener) { document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up); }
    }; });
  /* the row itself opens the widget - unless a drag just happened */
  /* categories - the widget */
  const readCat=()=>{ const n=document.getElementById('cName'), t=document.getElementById('cTagIn');
    if (n) state.page.name=n.value; if (t) state.page.draft=t.value; state.page.closeArm=false; state.page.delArm=false; };
  const openCat=(index)=>{ const c=index==null?null:store.categories[index]; state.nameArm=null;
    const extras = c ? withoutName(c.name, c.tags) : [];
    state.page={ kind:'cat', index, name:c?c.name:'', type:c?c.type:'Necessity', tags:extras.slice(), draft:'',
      was:{ name:c?c.name:'', type:c?c.type:'Necessity', tags:extras.slice() }, closeArm:false, focus:false, fresh:true };
    render(); state.page.fresh=false; };
  /* A tag is added on Enter (or a comma); the field stays ready for the next.
     Backspace on an empty field takes the last capsule back. */
  const addTag=()=>{ const p=state.page; const t=(p.draft||'').replace(/,/g,'').trim();
    if (t && !p.tags.some((x)=>same(x,t)) && !same(t, p.name)) p.tags.push(t);
    p.draft=''; p.focus=true; render(); };
  document.querySelectorAll('[data-catnew]').forEach((el)=>el.onclick=()=>{ if (!store.locked) openCat(null); });
  document.querySelectorAll('[data-catedit]').forEach((el)=>el.onclick=()=>{ if (!store.locked) openCat(+el.dataset.catedit); });
  /* known names: the group, its search and filter, Find, the widget */
  document.querySelectorAll('[data-nmfind]').forEach((el)=>el.onclick=()=>{ if (store.locked) return;
    const found = suggestNames(); state.page={ kind:'names', found, picked:[], fresh:true }; render(); state.page.fresh=false; });
  document.querySelectorAll('[data-namesall]').forEach((el)=>el.onclick=()=>{ const p=state.page; p.picked = p.picked.length===p.found.length ? [] : p.found.map((x,k)=>k); render(); });
  document.querySelectorAll('[data-namepick]').forEach((el)=>el.onclick=()=>{ const p=state.page, i=+el.dataset.namepick; p.picked = p.picked.includes(i) ? p.picked.filter((x)=>x!==i) : [...p.picked, i]; render(); });

  document.querySelectorAll('[data-namessave]').forEach((el)=>el.onclick=()=>{ const p=state.page; for (const i of p.picked) { const x=p.found[i]; if (x) learnName(x.name, x.tag); }

  /* the Always rules: pick, make known, drop */
  document.querySelectorAll('[data-trustsel]').forEach((el)=>el.onclick=()=>{ if (store.locked) return; const k=el.dataset.trustsel; const s=new Set(state.trustSel||[]); if (s.has(k)) s.delete(k); else s.add(k); state.trustSel=[...s]; state.trustArm=null; render(); });

  document.querySelectorAll('[data-trustdrop]').forEach((el)=>el.onclick=()=>{ if (state.trustArm!=='bulk') { state.trustArm='bulk'; render(); return; }
    const s=new Set(state.trustSel||[]); store.dismissed = (store.dismissed||[]).filter((k)=>!s.has(k)); state.trustSel=[]; state.trustArm=null; commit('Dismissed'); });
  document.querySelectorAll('[data-nmcat]').forEach((el)=>el.onclick=()=>{ state.nmCat=el.dataset.nmcat||null; render(); });
  document.querySelectorAll('[data-nmqclear]').forEach((el)=>el.onclick=()=>{ state.nmQ=''; render(); });
  const nq=document.getElementById('nmQ');
  document.querySelectorAll('[data-nmsort]').forEach((el)=>el.onclick=()=>{ state.nmSort = state.nmSort==='count' ? 'name' : 'count'; render(); });

  if (nq) nq.oninput=()=>{ state.nmQ=nq.value; const l=document.getElementById('nmList'), c=document.getElementById('nmCount'); const list = sortedNames(), shown = list.filter(nameShown);

  const readNm=()=>{ const p=state.page; const e=document.getElementById('nmName'); if (e) p.name=e.value; p.closeArm=false; p.delArm=false; };
  const openNm=(name)=>{ const n = name==null ? null : knownNames().find((x)=>x.name===name); const idx = n ? knownNames().indexOf(n) : null;

  }
  document.querySelectorAll('[data-sub]').forEach((el)=>el.onclick=()=>{ state.sub[state.tab]=el.dataset.sub; state.page=null; state.opf=null; state.budget=null; state.cat=null; state.warnKind=null; render(); });
  document.querySelectorAll('[data-rcatopen]').forEach((el)=>el.onclick=()=>{ state.cat=el.dataset.rcatopen; state.catMonths=[]; state.opf=null; state.page=null; state.catView='year'; state.chLo=state.chHi=null; render(); });
  document.querySelectorAll('[data-rcatview]').forEach((el)=>el.onclick=()=>{ state.catView=el.dataset.rcatview; state.page=null; render(); });
  if (state.tab==='report' && state.cat && state.catView==='history') { const c = store.categories.find((x)=>x.name===state.cat);
    if (c) wireRangeChart('ch', categoryMonths(c), chSeries(c), ()=>({ lo:state.chLo, hi:state.chHi }), (lo,hi)=>{ state.chLo=lo; state.chHi=hi; }); }
  document.querySelectorAll('[data-rcatclose]').forEach((el)=>el.onclick=()=>{ state.cat=null; state.catMonths=[]; state.opf=null; state.page=null; render(); });
  document.querySelectorAll('[data-rcatmonth]').forEach((el)=>el.onclick=()=>{ const m=el.dataset.rcatmonth;
    state.catMonths = state.catMonths.includes(m) ? state.catMonths.filter((x)=>x!==m) : [...state.catMonths, m]; render(); });
  document.querySelectorAll('[data-nwexplain]').forEach((el)=>el.onclick=()=>{ state.page={ kind:'nwexplain', fresh:true }; render(); state.page.fresh=false; });
  document.querySelectorAll('[data-nwclose]').forEach((el)=>el.onclick=()=>{ state.page=null; render(); });
  document.querySelectorAll('[data-nwcat]').forEach((el)=>el.onclick=()=>{ state.nwCat=el.dataset.nwcat; render(); });
  document.querySelectorAll('[data-nwhist]').forEach((el)=>el.onclick=()=>{ state.nwHist=el.dataset.nwhist; render(); });
  document.querySelectorAll('[data-savcur]').forEach((el)=>el.onclick=()=>{ state.savCur=el.dataset.savcur; render(); });
  document.querySelectorAll('[data-explain]').forEach((el)=>el.onclick=()=>{ state.page={ kind:'explain', which:el.dataset.explain, fresh:true }; render(); state.page.fresh=false; });
  document.querySelectorAll('[data-explainclose]').forEach((el)=>el.onclick=()=>{ state.page=null; render(); });
  if (state.tab==='summary' && sub('summary')==='history') {
    const pts = netWorthMonths(nwHistCat());
    if (pts.length > 1) wireRangeChart('nw', pts, nwSeries(), ()=>({ lo:state.nwLo, hi:state.nwHi }), (lo,hi)=>{ state.nwLo=lo; state.nwHi=hi; },
      (r)=>{ const k=document.getElementById('nwKpis'); if (k) k.innerHTML = nwKpis(pts, r.lo, r.hi); });
  }
  const ff=document.getElementById('fxFrom'), ft=document.getElementById('fxTo');
  if (ff) ff.onchange=()=>{ store.fxFrom=+ff.value; save(); };
  if (ft) ft.onchange=()=>{ store.fxTo=+ft.value; save(); };
  document.querySelectorAll('[data-fxfetch]').forEach((el)=>el.onclick=async()=>{
    if (store.locked) { state.fx={ msg:'Locked — nothing is written.', bad:true }; render(); return; }
    if (ff) store.fxFrom=+ff.value; if (ft) store.fxTo=+ft.value;
    if (store.fxFrom > store.fxTo) { const t=store.fxFrom; store.fxFrom=store.fxTo; store.fxTo=t; }
    save();
    state.fx={ msg:'Fetching…' }; render();
    try {
      const j = await BK.rates(store.backend, store.fxFrom, store.fxTo);
      store.rates = rateRows({ rows: (j.rows||[]).map((r)=>[r.month, r.eur, r.aud, r.date]) });
      store.backendVersion=j.backend; save();
      state.fxLo=null; state.fxHi=null;        // new history: show all of it
      state.fx={ msg:store.rates.length+' months in the sheet' };
    } catch (e) { state.fx={ msg:e.message, bad:true }; }
    render(); });

  /* The fields save as you type, so leaving the tab loses nothing. */
  const u=document.getElementById('bkUrl'), t=document.getElementById('bkTok');
  if (u) u.oninput=()=>{ store.backend.url=u.value.trim(); save(); };
  if (t) t.oninput=()=>{ store.backend.token=t.value.trim(); save(); };
  document.querySelectorAll('[data-bktest]').forEach((el)=>el.onclick=async()=>{
    if (u) store.backend.url=u.value.trim();
    if (t) store.backend.token=t.value.trim();
    save();
    state.sync={ msg:'Testing…' }; render();
    try {
      const j = await BK.ping(store.backend);
      store.backendVersion=j.backend; save();
      state.sync={ msg:'Connected — backend v'+j.backend };
    } catch (e) { state.sync={ msg:e.message, bad:true }; }
    render(); });

  document.querySelectorAll('[data-install]').forEach((el)=>el.onclick=async()=>{
    if (INSTALL_EVT) { INSTALL_EVT.prompt(); try { await INSTALL_EVT.userChoice; } catch (e) {} INSTALL_EVT=null; render(); return; }
    alert('Browser menu › Install app (or Add to Home Screen).'); });
}

if (!store.locked && tidyCategories()) { markDirty('Config'); save(); pushSoon(); }
render();

/* A fresh install with a connected sheet takes its config from the sheet, so
   a second phone starts where the first left off. A store with anything in
   it is left alone - what is here wins until it is pushed. */
if (connected() && !store.categories.length && !store.people.length && !store.accounts.length && !store.budgets.length && !store.rates.length) {
  pullNow().then(()=>render()).catch(()=>{});
}
/* Today's rate, every open; redraw if the Currency tab is showing. */
refreshLive().then((ok)=>{ if (ok && state.tab==='settings' && state.settings==='fx') render(); });

/* The backend version shown in About is whatever the script answered last.
   Ask again on every start, so a redeploy - and a hard reload - shows. */
if (connected()) {
  BK.ping(store.backend).then((j)=>{ if (j.backend !== store.backendVersion) { store.backendVersion=j.backend; save(); render(); } }).catch(()=>{});
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
