<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<title>Tally</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0d0f15; --bg2:#11131a; --card:#181b24; --card2:#1f2330; --line:#272b38;
    --txt:#eef1f7; --muted:#8a92a6; --accent:#3b82f6; --accent2:#7cb8ff;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    margin:0 -16px 14px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  header h1{font-size:20px;margin:0;letter-spacing:.3px;}
  header h1 .dot{color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:0 0 13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .muted{color:var(--muted)}

  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;
    color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  input,select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 10px;font-size:14px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:7px}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:active:not(:disabled){transform:scale(.98)}
  .status{font-size:12.5px;margin-top:10px;font-weight:600}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}

  .rows .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rows .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px} .row .v{font-weight:700;font-variant-numeric:tabular-nums}
  .row.tap{cursor:pointer}
  .row .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .row .chev{color:var(--muted);font-weight:700}

  /* Top-right group button: contour and the blue ground. */
  .gbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;min-width:26px;height:24px;
    padding:0 7px;font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0}
  .gbtn.ghost{background:none;color:var(--accent2);border-color:var(--line);font-weight:600;font-size:11.5px}
  .btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
  .act{color:var(--accent2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:5px 11px;color:var(--txt);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .cap{font-size:11px;font-weight:600;border-radius:12px;padding:2px 8px;border:1px solid var(--line);color:var(--txt);background:var(--card2)}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,26,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10;}
  nav button{background:none;border:none;color:var(--muted);font-size:9.5px;display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;padding:4px 1px;flex:1;min-width:0;font-family:inherit}
  nav button svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  nav button.active{color:var(--accent)}
  .tab.enter{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Tally<span class="dot">.</span></h1><div id="hdrRight" class="muted" style="font-size:12px;font-weight:600"></div></header>
  <div id="tabs"></div>
</div>
<nav id="nav"></nav>

<script src="backend.js"></script>
<script>
const APP_VERSION="5";
const BK = window.TallyBackend;

/* ------------------------------------------------------------------ store --
   Everything this device remembers, in one localStorage key. */
const KEY = 'tally-v1';
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ backend:{ url:'', token:'' }, backendVersion:null, categories:[], people:[] }, loadStore());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } };

const state = { tab:'settings', settings:'data', sync:null, page:null };

/* ------------------------------------------------------------- the model --
   Categories: a unique name, a type, and tags that are unique across ALL
   categories - one tag, one category. People: a unique name and a kind. */
const TYPES = [
  ['Necessity','#f87171'], ['Optional','#fbbf24'], ['Income','#4ade80'],
  ['Taxes','#eef1f7'], ['Savings','#3b82f6'], ['Misc','#5b6170'],
];
const typeColor = (t) => (TYPES.find(([k])=>k===t) || ['','#5b6170'])[1];
const PEOPLE_TYPES = ['Parent','Child'];
const same = (a,b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const splitTags = (s) => { const out=[]; for (const x of String(s||'').split(',').map((v)=>v.trim()).filter(Boolean)) if (!out.some((y)=>same(y,x))) out.push(x); return out; };

/* Throws with the reason. `skip` is the category being edited. */
function checkCategory(name, type, tags, skip){
  if (!name) throw new Error('A name.');
  if (!TYPES.some(([k])=>k===type)) throw new Error('A type.');
  if (store.categories.some((c)=>c!==skip && same(c.name, name))) throw new Error('"'+name+'" already exists.');
  for (const t of tags) {
    const owner = store.categories.find((c)=>c!==skip && c.tags.some((x)=>same(x,t)));
    if (owner) throw new Error('"'+t+'" is already in '+owner.name+'.');
  }
}
function checkPerson(name, type, skip){
  if (!name) throw new Error('A name.');
  if (!PEOPLE_TYPES.includes(type)) throw new Error('A type.');
  if (store.people.some((p)=>p!==skip && same(p.name, name))) throw new Error('"'+name+'" already exists.');
}

/* ----------------------------------------------------------- the sheet --
   Config is the FIRST tab and holds settings only: one row per category and
   per person. Financial records will get tabs of their own. */
function configTab(){
  return { name:'Config', index:1, headers:['Kind','Name','Type','Tags'],
    rows: store.categories.map((c)=>['category', c.name, c.type, c.tags.join(', ')])
      .concat(store.people.map((p)=>['person', p.name, p.type, ''])) };
}
function readConfig(tab){
  const cats=[], people=[];
  for (const r of (tab && tab.rows) || []) {
    const [kind, name, type, tags] = r.map((x)=>String(x==null?'':x).trim());
    if (!name) continue;
    if (kind==='category') cats.push({ name, type: TYPES.some(([k])=>k===type)?type:'Misc', tags: splitTags(tags) });
    if (kind==='person') people.push({ name, type: PEOPLE_TYPES.includes(type)?type:'Parent' });
  }
  return { categories:cats, people };
}
const connected = () => !!(store.backend.url && store.backend.token);
let pushTimer = null;
/* Every edit lands in the sheet shortly after; the status shows in Data. */
function pushSoon(){
  if (!connected()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 600);
}
async function pushNow(){
  if (!connected()) { state.sync={ msg:'Not connected.', bad:true }; render(); return; }
  state.sync={ msg:'Syncing…' }; render();
  try {
    const j = await BK.push(store.backend, [configTab()]);
    store.backendVersion=j.backend; store.syncedAt=new Date().toISOString(); save();
    state.sync={ msg:'Synced '+new Date().toTimeString().slice(0,5) };
  } catch (e) { state.sync={ msg:e.message, bad:true }; }
  render();
}
async function pullNow(){
  const j = await BK.pull(store.backend);
  const cfg = (j.tabs||[]).find((t)=>t.name==='Config');
  const got = readConfig(cfg);
  store.categories=got.categories; store.people=got.people;
  store.backendVersion=j.backend; store.syncedAt=new Date().toISOString(); save();
  return got;
}
/* A change to the model: keep it, show it, send it. */
function commit(){ save(); render(); pushSoon(); }
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ------------------------------------------------------------------- tabs --*/
const TABS = [
  ['summary','Summary','<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 4"/>'],
  ['report','Report','<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'],
  ['account','Account','<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/>'],
  ['history','History','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
  ['settings','Settings','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'],
];

const empty = (what) => `<div class="card"><h2>${esc(what)}</h2><div class="hint" style="margin-top:0">Nothing yet.</div></div>`;
const SCREENS = {
  summary: () => empty('Summary'),
  report:  () => empty('Report'),
  account: () => empty('Account'),
  history: () => empty('History'),
  settings: tabSettings,
};

/* --------------------------------------------------------------- settings --*/
const SETTINGS_TABS = [['data','Data'],['tags','Tags'],['people','People'],['about','About']];

function tabSettings(){
  const which = SETTINGS_TABS.some(([k])=>k===state.settings) ? state.settings : 'data';
  return `
  <div class="pillrow">${SETTINGS_TABS.map(([id,label])=>
    `<button class="pill ${which===id?'on':''}" data-set="${id}">${label}</button>`).join('')}</div>
  ${which==='data' ? settingsData()
    : which==='tags' ? settingsTags()
    : which==='people' ? settingsPeople()
    : settingsAbout()}`;
}

/* A page one level down inside the tab: same chrome, a back link where the
   heading would be. Nothing slides up from the bottom. */
function settingsTags(){
  const p = state.page;
  if (p && p.kind==='cat') return catPage(p);
  return `
  <div class="card">
    <h2>Categories <button class="gbtn" data-catnew="1">+</button></h2>
    ${store.categories.length ? `<div class="rows">${store.categories.map((c,i)=>`
      <div class="row tap" data-catedit="${i}">
        <div style="flex:1;min-width:0">
          <div class="k" style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${typeColor(c.type)}"></span><b>${esc(c.name)}</b>
            <span class="muted" style="font-size:11.5px">${esc(c.type)}</span></div>
          ${c.tags.length?`<div class="caps">${c.tags.map((t)=>`<span class="cap">${esc(t)}</span>`).join('')}</div>`:''}
        </div>
        <span class="chev">›</span>
      </div>`).join('')}</div>`
    : `<div class="hint" style="margin-top:0">Nothing yet.</div>`}
  </div>`;
}
function catPage(p){
  const isNew = p.index==null;
  return `
  <div class="card">
    <h2><span class="act" data-pageback="1">‹ Categories</span> ${isNew?'New category':esc(store.categories[p.index].name)}</h2>
    <div class="field"><label>Name</label><input id="cName" value="${esc(p.name)}"></div>
    <div class="field"><label>Type</label>
      <div class="chips">${TYPES.map(([k,col])=>
        `<button class="chip ${p.type===k?'on':''}" data-cattype="${k}"><span class="dot" style="background:${col}"></span>${k}</button>`).join('')}</div></div>
    <div class="field"><label>Tags</label><input id="cTags" value="${esc(p.tags)}" placeholder="comma separated"></div>
    <div class="btnrow">
      <button class="btn primary" data-catsave="1">${isNew?'Create':'Save'}</button>
      <button class="btn" data-pageback="1">Cancel</button>
    </div>
    ${isNew?'':`<button class="btn danger" style="margin-top:7px;width:100%" data-catdelete="${p.index}">Delete</button>`}
  </div>`;
}
function settingsPeople(){
  const p = state.page;
  if (p && p.kind==='person') return personPage(p);
  return `
  <div class="card">
    <h2>People <button class="gbtn" data-personnew="1">+</button></h2>
    ${store.people.length ? `<div class="rows">${store.people.map((x,i)=>`
      <div class="row tap" data-personedit="${i}">
        <div class="k"><b>${esc(x.name)}</b> <span class="muted" style="font-size:11.5px">${esc(x.type)}</span></div>
        <span class="chev">›</span>
      </div>`).join('')}</div>`
    : `<div class="hint" style="margin-top:0">Nobody yet.</div>`}
  </div>`;
}
function personPage(p){
  const isNew = p.index==null;
  return `
  <div class="card">
    <h2><span class="act" data-pageback="1">‹ People</span> ${isNew?'New person':esc(store.people[p.index].name)}</h2>
    <div class="field"><label>Name</label><input id="pName" value="${esc(p.name)}"></div>
    <div class="field"><label>Type</label>
      <div class="chips">${PEOPLE_TYPES.map((k)=>
        `<button class="chip ${p.type===k?'on':''}" data-persontype="${k}">${k}</button>`).join('')}</div></div>
    <div class="btnrow">
      <button class="btn primary" data-personsave="1">${isNew?'Create':'Save'}</button>
      <button class="btn" data-pageback="1">Cancel</button>
    </div>
    ${isNew?'':`<button class="btn danger" style="margin-top:7px;width:100%" data-persondelete="${p.index}">Delete</button>`}
  </div>`;
}

function settingsData(){
  const b = store.backend;
  const st = state.sync;
  return `
  <div class="card">
    <h2>Spreadsheet</h2>
    <div class="field"><label>Script url</label>
      <input id="bkUrl" value="${esc(b.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Token</label>
      <input id="bkTok" value="${esc(b.token)}" type="password" autocapitalize="off"></div>
    <div class="btnrow">
      <button class="btn" data-bktest="1">Test</button>
      <button class="btn primary" data-bksync="1" ${connected()?'':'disabled'}>Sync</button>
    </div>
    ${st?`<div class="status ${st.bad?'bad':'ok'}">${esc(st.msg)}</div>`:''}
  </div>`;
}

/* Whether the page runs as an installed app rather than a browser tab. */
const standalone = () => (typeof matchMedia==='function' && matchMedia('(display-mode: standalone)').matches)
  || (typeof navigator!=='undefined' && navigator.standalone===true);
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; render(); });

function settingsAbout(){
  return `
  <div class="card">
    <h2>Versions</h2>
    <div class="rows">
      <div class="row"><span class="k">App</span><span class="v">v${APP_VERSION}</span></div>
      <div class="row"><span class="k">Backend</span><span class="v">${store.backendVersion?'v'+esc(store.backendVersion):'—'}</span></div>
    </div>
  </div>
  ${standalone() ? '' : `<div class="card">
    <h2>Install</h2>
    <button class="btn primary" data-install="1">Install on this phone</button>
  </div>`}`;
}

/* ----------------------------------------------------------------- render --*/
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(([id,label,icon]) =>
    `<button class="${state.tab===id?'active':''}" data-tab="${id}"><svg viewBox="0 0 24 24">${icon}</svg>${label}</button>`).join('');
}
/* Only actually going somewhere animates and scrolls to the top; a redraw
   from a button on the same screen must not jump. */
const screenKey = () => state.tab + '|' + (state.tab==='settings' ? state.settings : '') + '|' + (state.page ? state.page.kind + (state.page.index==null?'new':state.page.index) : '');
let lastScreen = null;
function render(){
  const key = screenKey(), moved = key !== lastScreen;
  lastScreen = key;
  renderNav();
  /* The version in the top bar, so a phone that has not picked up a deploy is
     obvious at a glance. */
  document.getElementById('hdrRight').textContent = 'v' + APP_VERSION;
  document.getElementById('tabs').innerHTML = `<div class="tab${moved?' enter':''}">${SCREENS[state.tab]()}</div>`;
  wire();
  if (moved) scrollTo({ top:0 });
}

function wire(){
  document.querySelectorAll('[data-tab]').forEach((el)=>el.onclick=()=>{ state.tab=el.dataset.tab; render(); });
  document.querySelectorAll('[data-set]').forEach((el)=>el.onclick=()=>{ state.settings=el.dataset.set; state.page=null; render(); });
  document.querySelectorAll('[data-pageback]').forEach((el)=>el.onclick=()=>{ state.page=null; render(); });

  /* categories */
  const readCat=()=>{ const n=document.getElementById('cName'), t=document.getElementById('cTags');
    if (n) state.page.name=n.value; if (t) state.page.tags=t.value; };
  document.querySelectorAll('[data-catnew]').forEach((el)=>el.onclick=()=>{
    state.page={ kind:'cat', index:null, name:'', type:'Necessity', tags:'' }; render(); });
  document.querySelectorAll('[data-catedit]').forEach((el)=>el.onclick=()=>{
    const c=store.categories[+el.dataset.catedit]; if (!c) return;
    state.page={ kind:'cat', index:+el.dataset.catedit, name:c.name, type:c.type, tags:c.tags.join(', ') }; render(); });
  document.querySelectorAll('[data-cattype]').forEach((el)=>el.onclick=()=>{ readCat(); state.page.type=el.dataset.cattype; render(); });
  document.querySelectorAll('[data-catsave]').forEach((el)=>el.onclick=()=>{
    readCat(); const p=state.page;
    const name=p.name.trim(), tags=splitTags(p.tags);
    const cur = p.index==null ? null : store.categories[p.index];
    try { checkCategory(name, p.type, tags, cur); } catch (e) { alert(e.message); return; }
    if (cur) Object.assign(cur, { name, type:p.type, tags });
    else store.categories.push({ name, type:p.type, tags });
    state.page=null; commit(); });
  document.querySelectorAll('[data-catdelete]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Delete this category?')) return;
    store.categories.splice(+el.dataset.catdelete, 1); state.page=null; commit(); });

  /* people */
  const readPerson=()=>{ const n=document.getElementById('pName'); if (n) state.page.name=n.value; };
  document.querySelectorAll('[data-personnew]').forEach((el)=>el.onclick=()=>{
    state.page={ kind:'person', index:null, name:'', type:'Parent' }; render(); });
  document.querySelectorAll('[data-personedit]').forEach((el)=>el.onclick=()=>{
    const x=store.people[+el.dataset.personedit]; if (!x) return;
    state.page={ kind:'person', index:+el.dataset.personedit, name:x.name, type:x.type }; render(); });
  document.querySelectorAll('[data-persontype]').forEach((el)=>el.onclick=()=>{ readPerson(); state.page.type=el.dataset.persontype; render(); });
  document.querySelectorAll('[data-personsave]').forEach((el)=>el.onclick=()=>{
    readPerson(); const p=state.page; const name=p.name.trim();
    const cur = p.index==null ? null : store.people[p.index];
    try { checkPerson(name, p.type, cur); } catch (e) { alert(e.message); return; }
    if (cur) Object.assign(cur, { name, type:p.type }); else store.people.push({ name, type:p.type });
    state.page=null; commit(); });
  document.querySelectorAll('[data-persondelete]').forEach((el)=>el.onclick=()=>{
    if (!confirm('Delete this person?')) return;
    store.people.splice(+el.dataset.persondelete, 1); state.page=null; commit(); });

  document.querySelectorAll('[data-bksync]').forEach((el)=>el.onclick=()=>pushNow());

  /* The fields save as you type, so leaving the tab loses nothing. */
  const u=document.getElementById('bkUrl'), t=document.getElementById('bkTok');
  if (u) u.oninput=()=>{ store.backend.url=u.value.trim(); save(); };
  if (t) t.oninput=()=>{ store.backend.token=t.value.trim(); save(); };
  document.querySelectorAll('[data-bktest]').forEach((el)=>el.onclick=async()=>{
    if (u) store.backend.url=u.value.trim();
    if (t) store.backend.token=t.value.trim();
    save();
    state.sync={ msg:'Testing…' }; render();
    try {
      const j = await BK.ping(store.backend);
      store.backendVersion=j.backend; save();
      state.sync={ msg:'Connected — backend v'+j.backend };
    } catch (e) { state.sync={ msg:e.message, bad:true }; }
    render(); });

  document.querySelectorAll('[data-install]').forEach((el)=>el.onclick=async()=>{
    if (INSTALL_EVT) { INSTALL_EVT.prompt(); try { await INSTALL_EVT.userChoice; } catch (e) {} INSTALL_EVT=null; render(); return; }
    alert('Browser menu › Install app (or Add to Home Screen).'); });
}

render();

/* A fresh install with a connected sheet takes its config from the sheet, so
   a second phone starts where the first left off. A store with anything in
   it is left alone - what is here wins until it is pushed. */
if (connected() && !store.categories.length && !store.people.length) {
  pullNow().then((got)=>{ if (got.categories.length || got.people.length) render(); }).catch(()=>{});
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
